<script>
  /* 主题预置：跟随系统或用户此前的选择，防刷新闪屏 */
  (function () {
    var de = document.documentElement;
    de.classList.add('js');
    try {
      var t = localStorage.getItem('htools:theme');
      if (t !== 'light' && t !== 'dark') {
        t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      de.setAttribute('data-theme', t);
      var m = document.getElementById('meta-theme');
      if (m) m.setAttribute('content', t === 'dark' ? '#0a0a0a' : '#fbfbfc');
    } catch (e) {}
  })();

<style>
  /* ============================================================
     设计 token：CloudAI aidbs 主题（Light / Dark 实际取值）
     ============================================================ */
  :root {
    color-scheme: light;

    --background: hsl(0 0% 98.82%);
    --background-95: hsl(0 0% 98.82% / .95);
    --card: hsl(0 0% 100%);
    --card-foreground: hsl(240 4.76% 4.12%);
    --foreground: hsl(240 4.76% 4.12%);
    --muted: hsl(240 9.09% 95.69%);
    --muted-foreground: hsl(240 1.1% 64.31%);
    --secondary-foreground: hsl(240 4.76% 4.12%);
    --accent: hsl(240 9.09% 95.69%);
    --accent-foreground: hsl(240 4.55% 8.63%);
    --border: hsl(220 5.66% 89.61%);
    --input: hsl(220 5.66% 89.61%);
    --ring: hsl(240 1.1% 64.31%);
    --primary: hsl(0 0% 9.02%);
    --primary-foreground: hsl(0 0% 98.04%);
    --popover: hsl(0 0% 100%);
    --popover-foreground: hsl(240 4.76% 4.12%);

    --brand: hsl(235.65 84.93% 71.37%);
    --brand-1: hsl(240 100% 98.43%);
    --brand-2: hsl(236.25 94.12% 93.33%);
    --brand-6: hsl(235.65 84.93% 71.37%);
    --brand-foreground: hsl(236.82 73.33% 64.71%);

    --sidebar-foreground: hsl(240 13.95% 16.86%);
    --sidebar-accent: hsl(240 18.18% 95.69%);
    --sidebar-accent-foreground: hsl(240 13.95% 16.86%);

    /* 页面级私有 token（--t- 前缀，避免与设计 token 撞名） */
    --t-scrollbar: hsl(240 1.1% 64.31% / .42); /* 细滚动条 */

    --radius: 8px;
    --radius-card: 12px;
    --radius-panel: 20px;

    --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang SC", "Helvetica Neue", "Segoe UI", sans-serif;
    --mono: "SF Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  html[data-theme="dark"] {
    color-scheme: dark;

    --background: hsl(0 0% 3.92%);
    --background-95: hsl(0 0% 3.92% / .95);
    --card: hsl(0 0% 9.02%);
    --card-foreground: hsl(0 0% 98.04%);
    --foreground: hsl(0 0% 98.04%);
    --muted: hsl(0 0% 14.9%);
    --muted-foreground: hsl(240 0.83% 52.55%);
    --secondary-foreground: hsl(0 0% 98.04%);
    --accent: hsl(0 0% 25.1%);
    --accent-foreground: hsl(0 0% 98.04%);
    --border: hsl(0 0% 14.9%);
    --input: hsl(0 0% 14.9%);
    --ring: hsl(0 0% 45.1%);
    --primary: hsl(0 0% 89.8%);
    --primary-foreground: hsl(0 0% 9.02%);
    --popover: hsl(0 0% 14.9%);
    --popover-foreground: hsl(0 0% 98.04%);

    --brand: hsl(234.88 93.18% 82.75%);
    --brand-1: hsl(237.45 47.47% 19.41%);
    --brand-2: hsl(236.57 48.61% 28.24%);
    --brand-6: hsl(234.88 93.18% 82.75%);
    --brand-foreground: hsl(235.79 93.44% 88.04%);

    --sidebar-foreground: hsl(264 100% 99.02%);
    --sidebar-accent: hsl(0 0% 14.9%);
    --sidebar-accent-foreground: hsl(0 0% 98.04%);

    --t-scrollbar: hsl(240 0.83% 52.55% / .5);
  }

  /* ================= 基础 ================= */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: var(--font);
    font-size: 14px;
    line-height: 1.5;
    background: var(--background);
    color: var(--foreground);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    -webkit-tap-highlight-color: transparent;
  }
  button { touch-action: manipulation; font-family: inherit; }
  a { color: inherit; }
  ::selection { background: hsl(235.65 84.93% 71.37% / .28); }

  /* ============================================================
     AppShell
     ============================================================ */
  .shell {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: linear-gradient(to bottom, var(--card) 0%, var(--brand-1) 52%, var(--brand-2) 100%);
  }

  .topbar {
    flex-shrink: 0;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 0 max(24px, env(safe-area-inset-right)) 0 max(24px, env(safe-area-inset-left));
  }
  .topbar-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .topbar-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

  .tbtn {
    width: 32px;
    height: 32px;
    border: none;
    border-radius: 6px;
    background: transparent;
    color: var(--foreground);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    text-decoration: none;
    flex-shrink: 0;
    transition: background-color .15s, color .15s, transform .1s;
  }
  .tbtn:hover { background: var(--accent); }
  .tbtn:active { transform: scale(.92); }
  .tbtn:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--ring); }
  .tbtn svg { width: 16px; height: 16px; }

  .brand { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--foreground); }
  .brand-mark {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    background: var(--foreground);
    color: var(--background);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .brand-mark svg { width: 14px; height: 14px; }
  .brand-name { font-size: 14px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; }

  .tbar-sep { width: 1px; height: 20px; background: var(--border); flex-shrink: 0; }
  .tbar-label { font-size: 13px; color: var(--muted-foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .theme-btn { position: relative; }
  .theme-btn .i {
    position: absolute;
    display: inline-flex;
    transition: opacity .25s, transform .3s;
  }
  .theme-btn .i-moon { opacity: 1; transform: none; }
  .theme-btn .i-sun { opacity: 0; transform: rotate(-90deg) scale(.5); }
  html[data-theme="dark"] .theme-btn .i-moon { opacity: 0; transform: rotate(90deg) scale(.5); }
  html[data-theme="dark"] .theme-btn .i-sun { opacity: 1; transform: none; }

  .main-row {
    flex: 1;
    min-height: 0;
    display: flex;
    gap: 8px;
    padding: 0 max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
  }

  .sidebar {
    display: none;
    width: 248px;
    flex-shrink: 0;
    flex-direction: column;
    gap: 16px;
    padding: 20px 8px 12px;
  }
  .shell[data-sidebar="open"] .sidebar { display: flex; }
  .sidebar-nav {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    scrollbar-gutter: stable;
    scrollbar-width: thin;
    scrollbar-color: var(--t-scrollbar) transparent;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .sidebar-nav::-webkit-scrollbar { width: 8px; }
  .sidebar-nav::-webkit-scrollbar-thumb {
    background: var(--t-scrollbar);
    border-radius: 999px;
    border: 2px solid transparent;
    background-clip: content-box;
  }
  .side-group { display: flex; flex-direction: column; gap: 2px; }
  .side-label { font-size: 12px; color: var(--muted-foreground); padding: 4px 8px; }
  .side-item {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 32px;
    padding: 0 8px;
    border-radius: 6px;
    font-size: 14px;
    color: var(--sidebar-foreground);
    text-decoration: none;
    white-space: nowrap;
    transition: background-color .15s, color .15s;
  }
  .side-item svg { width: 16px; height: 16px; flex-shrink: 0; color: var(--secondary-foreground); }
  .side-item:hover { background: var(--sidebar-accent); }
  .side-item.is-active { background: var(--brand-1); color: var(--sidebar-accent-foreground); font-weight: 500; }
  .side-item .side-dot {
    width: 6px; height: 6px; border-radius: 999px;
    background: var(--brand);
    flex-shrink: 0;
  }
  .side-foot { flex-shrink: 0; font-size: 11.5px; line-height: 1.6; color: var(--muted-foreground); padding: 0 8px; }

  .content {
    position: relative;
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    border: 1px solid var(--brand-2);
    border-radius: var(--radius-panel);
    background: var(--background-95);
    box-shadow: 0 10px 15px -3px rgb(0 0 0 / .1), 0 4px 6px -4px rgb(0 0 0 / .1);
    overflow: hidden;
  }
  .content-scroll {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    scrollbar-gutter: stable; /* 滚动条常驻 gutter，出现/消失都不挤内容 */
    scrollbar-width: thin;
    scrollbar-color: var(--t-scrollbar) transparent;
  }
  .content-scroll::-webkit-scrollbar { width: 8px; }
  .content-scroll::-webkit-scrollbar-thumb {
    background: var(--t-scrollbar);
    border-radius: 999px;
    border: 2px solid transparent;
    background-clip: content-box;
  }
  .content-mask {
    position: absolute;
    inset: auto 0 0 0;
    height: 88px;
    background: linear-gradient(to bottom, transparent, var(--background));
    pointer-events: none;
  }

  .page { padding: 16px clamp(16px, 3vw, 36px) 36px; }

  /* ---------- 页头栏：标题 + 描述，由注册表填充，不随滚动动 ---------- */
  .detail-bar {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--background);
  }
  .detail-bar h1 { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.3; white-space: nowrap; }
  .detail-desc { font-size: 12px; color: var(--muted-foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  @media (max-width: 480px) { .detail-desc { display: none; } }

  .tool-body { display: flex; flex-direction: column; gap: 16px; }

  /* ============================================================
     工具样式（字节换算）：token 已重映射到设计体系
     ============================================================ */
  .card {
    width: 100%;
    max-width: 560px;
    margin: 0 auto;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-card);
    padding: clamp(20px, 3vw, 28px);
  }

  /* 规则切换（Windows / Mac） */
  .seg {
    display: flex;
    background: var(--muted);
    border-radius: 6px;
    padding: 2px;
    margin-bottom: 20px;
  }
  .seg-btn {
    flex: 1;
    border: none;
    background: transparent;
    height: 30px;
    border-radius: 4px;
    font-size: 13px;
    font-weight: 500;
    color: var(--muted-foreground);
    cursor: pointer;
    font-family: inherit;
    transition: background-color .18s, color .18s, transform .1s;
  }
  .seg-btn.active {
    background: var(--card);
    color: var(--foreground);
    box-shadow: 0 1px 3px rgba(0, 0, 0, .10);
  }
  .seg-btn:active { transform: scale(.97); }
  .seg-btn:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--ring); }

  /* 输入区 */
  .input-row { display: flex; gap: 10px; margin-bottom: 24px; }
  .num-wrap { flex: 1; position: relative; min-width: 0; }
  .num-input {
    width: 100%;
    height: 40px;
    border: 1px solid var(--input);
    border-radius: 6px;
    font-size: 16px;
    font-weight: 500;
    padding: 0 14px;
    color: var(--foreground);
    background: var(--background);
    outline: none;
    transition: border-color .2s, box-shadow .2s;
    font-family: inherit;
  }
  .num-input:focus { border-color: var(--ring); box-shadow: 0 0 0 2px var(--ring); }
  .num-input::-webkit-outer-spin-button,
  .num-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .unit-select {
    height: 40px;
    min-width: 128px;
    border: 1px solid var(--input);
    border-radius: 6px;
    font-size: 15px;
    font-weight: 500;
    padding: 0 12px;
    color: var(--foreground);
    background: var(--background) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' fill='none' stroke='%238e8e96' stroke-width='1.5' stroke-linecap='round'/></svg>") no-repeat right 14px center;
    -webkit-appearance: none;
    appearance: none;
    outline: none;
    cursor: pointer;
    transition: border-color .2s, box-shadow .2s;
    font-family: inherit;
  }
  .unit-select:focus { border-color: var(--ring); box-shadow: 0 0 0 2px var(--ring); }

  /* 结果列表 */
  .results { list-style: none; }
  .results li {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 11px 4px 11px 14px;
    border-bottom: 1px solid var(--muted);
    gap: 12px;
    transition: background-color .15s;
    border-radius: 8px;
  }
  .results li:last-child { border-bottom: none; }
  .results li:hover { background: var(--muted); }
  .results li.active { background: var(--brand-1); }
  .results li.active .u-name { color: var(--brand-foreground); }
  .u-name {
    font-size: 14px;
    font-weight: 500;
    color: var(--foreground);
    flex-shrink: 0;
    display: flex;
    align-items: baseline;
    gap: 6px;
  }
  .u-name small {
    font-size: 11px;
    font-weight: 400;
    color: var(--muted-foreground);
  }
  .u-val {
    font-size: 15px;
    font-weight: 600;
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    color: var(--foreground);
    text-align: right;
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .copy-btn {
    flex-shrink: 0;
    width: 28px;
    height: 28px;
    border: none;
    border-radius: 6px;
    background: transparent;
    color: var(--muted-foreground);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity .15s, background-color .15s, color .15s;
  }
  .results li:hover .copy-btn { opacity: 1; }
  .copy-btn:hover { background: var(--muted); color: var(--foreground); }
  .copy-btn.copied { opacity: 1; color: var(--brand-foreground); }
  .copy-btn svg { width: 14px; height: 14px; }
  @media (hover: none) { .copy-btn { opacity: 1; } }

  /* 折叠按钮 */
  .more-toggle {
    display: block;
    width: 100%;
    border: none;
    background: transparent;
    color: var(--brand-foreground);
    font-size: 13px;
    font-weight: 500;
    padding: 12px 0 8px;
    cursor: pointer;
    font-family: inherit;
    text-align: center;
    letter-spacing: .2px;
  }
  .more-toggle:hover { opacity: .65; }
  .more-toggle .arrow {
    display: inline-block;
    margin-left: 2px;
    transition: transform .2s;
  }
  .more-toggle.open .arrow { transform: rotate(180deg); }

  /* 脚注 */
  .foot {
    margin-top: 24px;
    padding-top: 18px;
    border-top: 1px solid var(--muted);
    font-size: 12px;
    color: var(--muted-foreground);
    line-height: 1.6;
    text-align: center;
  }
  .foot code {
    font-family: var(--mono);
    font-size: 11px;
    background: var(--muted);
    padding: 1px 5px;
    border-radius: 4px;
    color: var(--muted-foreground);
  }

  /* ---------- 窄屏：顶栏精简 ---------- */
  @media (max-width: 640px) {
    .tbar-sep, .tbar-label { display: none; }
  }

  /* ---------- 移动端侧栏：覆盖抽屉 + 背景挡板 ---------- */
  .sidebar-backdrop {
    display: none;
    position: fixed;
    inset: 56px 0 0 0;
    background: rgb(0 0 0 / .32);
    z-index: 40;
  }
  @media (max-width: 767px) {
    .shell[data-sidebar="open"] .sidebar {
      position: fixed;
      top: 68px;
      left: 12px;
      bottom: 12px;
      width: 248px;
      z-index: 50;
      background: var(--popover);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      box-shadow: 0 24px 48px rgb(0 0 0 / .18);
      padding: 12px 8px;
    }
    .shell[data-sidebar="open"] .sidebar-backdrop { display: block; }
  }
  @media (min-width: 768px) { .sidebar-backdrop { display: none !important; } }

  /* ================= 动效减弱 ================= */
  @media (prefers-reduced-motion: reduce) {
    .tbtn, .tbtn:active, .seg-btn, .seg-btn:active, .theme-btn .i, .side-item,
    .results li, .copy-btn, .more-toggle .arrow, .num-input, .unit-select {
      transition: none !important;
      transform: none !important;
    }
  }
</style>
</head>
<body>
  <div class="shell" id="shell" data-sidebar="closed">
    <!-- ================= TopBar ================= -->

      <div class="topbar-left">

          </span>
        </button>
      </div>

<script>
/* ============================================================
   外壳脚本（与 _template.html 一致）：侧栏注册表 / 页头填充 / 主题
   ============================================================ */
(function () {
  'use strict';

  var ICONS = {
    byte: '<ellipse cx="12" cy="5.5" rx="7.5" ry="3"/><path d="M4.5 5.5v6c0 1.66 3.36 3 7.5 3s7.5-1.34 7.5-3v-6"/><path d="M4.5 11.5c0 1.66 3.36 3 7.5 3s7.5-1.34 7.5-3"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    code: '<path d="M9 8l-4 4 4 4M15 8l4 4-4 4"/>',
    text: '<path d="M4 6.5V5h16v1.5M12 5v14M8.5 19h7"/>',
    time: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3.5 2"/>',
    color: '<path d="M12 3.5c4.7 0 8.5 3.4 8.5 7.6 0 2.6-2 4.4-4.4 4.4h-2.3c-1 0-1.6.7-1.6 1.6 0 .5.2.9.2 1.4 0 .9-.7 1.5-1.5 1.5-4.4 0-7.9-3.7-7.9-8.2C3 6.9 6.9 3.5 12 3.5z"/><circle cx="8" cy="9.5" r="1.3" fill="currentColor" stroke="none"/><circle cx="12" cy="7.5" r="1.3" fill="currentColor" stroke="none"/><circle cx="16" cy="9.5" r="1.3" fill="currentColor" stroke="none"/>',
    image: '<rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="M3.5 16.5l4.5-4.5 4 3.5 3.5-3 5 4.5"/>'
  };

  var shell = document.getElementById('shell');
  var sidebarToggle = document.getElementById('sidebar-toggle');
  var sidebarBackdrop = document.getElementById('sidebar-backdrop');
  var sideTools = document.getElementById('side-tools');
  var tbarLabel = document.getElementById('tbar-label');
  var detailName = document.getElementById('detail-name');
  var detailDesc = document.getElementById('detail-desc');
  var metaTheme = document.getElementById('meta-theme');
  var themeBtn = document.getElementById('theme-toggle');

  var list = (typeof TOOLS !== 'undefined' && Array.isArray(TOOLS)) ? TOOLS : [];
  var me = '';
  try { me = decodeURIComponent(location.pathname.split('/').pop() || ''); } catch (e) {}

  var current = null;
  if (list.length) {
    list.forEach(function (t) {
      var fileName = (t.file || '').split('/').pop();
      var a = document.createElement('a');
      a.className = 'side-item' + (fileName === me ? ' is-active' : '');
      a.href = t.file;
      if (fileName === me) {
        a.setAttribute('aria-current', 'page');
        current = t;
      }
      a.innerHTML =
        '<span class="side-dot" style="background-color:' + (t.accent || '#0071e3') + '"></span>' +
        '<span style="overflow:hidden;text-overflow:ellipsis">' + t.name + '</span>';
      sideTools.appendChild(a);
    });
    sideTools.hidden = false;
  }

  if (current) {
    tbarLabel.textContent = current.name;
    detailName.textContent = current.name;
    detailDesc.textContent = current.desc;
    document.title = current.name + ' · htools';
  }

  var mqWide = window.matchMedia('(min-width: 90rem)');
  var userTookOver = false;

  function setSidebar(open) {
    shell.setAttribute('data-sidebar', open ? 'open' : 'closed');
    sidebarToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    sidebarToggle.setAttribute('aria-label', open ? '收起侧栏' : '展开侧栏');
  }
  function syncSidebar() {
    if (!userTookOver) setSidebar(mqWide.matches);
  }
  sidebarToggle.addEventListener('click', function () {
    userTookOver = true;
    setSidebar(shell.getAttribute('data-sidebar') !== 'open');
  });
  sidebarBackdrop.addEventListener('click', function () {
    userTookOver = true;
    setSidebar(false);
  });
  if (typeof mqWide.addEventListener === 'function') {
    mqWide.addEventListener('change', syncSidebar);
  }
  syncSidebar();

  var mqDark = window.matchMedia('(prefers-color-scheme: dark)');
  function storedTheme() {
    try { return localStorage.getItem('htools:theme'); } catch (e) { return null; }
  }
  function currentTheme() {
    return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  }
  function applyTheme(t, persist) {
    document.documentElement.setAttribute('data-theme', t);
    if (metaTheme) metaTheme.setAttribute('content', t === 'dark' ? '#0a0a0a' : '#fbfbfc');
    if (persist) {
      try { localStorage.setItem('htools:theme', t); } catch (e) {}
    }
  }
  applyTheme(currentTheme(), false);
  themeBtn.addEventListener('click', function () {
    applyTheme(currentTheme() === 'dark' ? 'light' : 'dark', true);
  });
  if (typeof mqDark.addEventListener === 'function') {
    mqDark.addEventListener('change', function (e) {
      if (!storedTheme()) applyTheme(e.matches ? 'dark' : 'light', false);
    });
  }
})();
</script>
<script>
/* ============================================================
   工具脚本（字节换算）：逻辑未改动，仅外壳与 token 迁移
   ============================================================ */
(function () {
  // 单位定义，power 为该单位相对字节(Byte)的进制幂次；bit 固定为 1/8 字节
  var unitDefs = [
    { key: 'bit', name: '比特',     short: 'bit', power: null },  // bit 特殊处理
    { key: 'B',   name: '字节',     short: 'B',   power: 0 },
    { key: 'KB',  name: '千字节',   short: 'KB',  power: 1 },
    { key: 'MB',  name: '兆字节',   short: 'MB',  power: 2 },
    { key: 'GB',  name: '千兆字节', short: 'GB',  power: 3 },
    { key: 'TB',  name: '太字节',   short: 'TB',  power: 4 },
    { key: 'PB',  name: '拍字节',   short: 'PB',  power: 5 },
    { key: 'EB',  name: '艾字节',   short: 'EB',  power: 6 },
    { key: 'ZB',  name: '泽字节',   short: 'ZB',  power: 7 },
    { key: 'YB',  name: '尧字节',   short: 'YB',  power: 8 }
  ];

  // 默认展示到 TB（含），之后的单位折叠
  var CUT = 5; // 索引 <= 5 常显，> 5 折叠

  // 进制基数：Windows 二进制 1024，Mac 十进制 1000
  var base = 1024;

  function factorOf(def) {
    if (def.key === 'bit') return 1 / 8;        // bit 不受进制影响
    return Math.pow(base, def.power);
  }

  var numInput = document.getElementById('numInput');
  var unitSelect = document.getElementById('unitSelect');
  var resultsMain = document.getElementById('resultsMain');
  var resultsMore = document.getElementById('resultsMore');
  var moreToggle = document.getElementById('moreToggle');
  var seg = document.getElementById('seg');

  var expanded = false;

  // 填充下拉
  unitDefs.forEach(function (u, i) {
    var opt = document.createElement('option');
    opt.value = i;
    opt.textContent = u.name + ' (' + u.short + ')';
    unitSelect.appendChild(opt);
  });
  unitSelect.value = 1; // 默认：字节 B

  function fmt(v) {
    if (v === 0) return '0.00';
    if (!isFinite(v)) return '—';
    var abs = Math.abs(v);
    if (abs > 0 && abs < 0.005) {
      return v.toExponential(2).replace('e+', 'e');
    }
    if (abs >= 1e15) {
      return v.toExponential(2).replace('e+', 'e');
    }
    return v.toFixed(2);
  }

  function buildRow(u, i, unitIdx, baseBytes) {
    var converted = baseBytes / factorOf(u);
    var li = document.createElement('li');
    if (i === unitIdx) li.className = 'active';

    var name = document.createElement('div');
    name.className = 'u-name';
    name.innerHTML = u.name + ' <small>' + u.short + '</small>';

    var valEl = document.createElement('div');
    valEl.className = 'u-val';
    valEl.textContent = fmt(converted);

    var btn = document.createElement('button');
    btn.className = 'copy-btn';
    btn.title = '复制';
    btn.innerHTML = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="8" height="8" rx="1.5"/><path d="M11 5V3.5A1.5 1.5 0 0 0 9.5 2h-6A1.5 1.5 0 0 0 2 3.5v6A1.5 1.5 0 0 0 3.5 11H5"/></svg>';
    btn.addEventListener('click', function () {
      var text = valEl.textContent;
      var tmp = document.createElement('textarea');
      tmp.value = text;
      document.body.appendChild(tmp);
      tmp.select();
      try { document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(tmp);
      btn.classList.add('copied');
      var sv = btn.querySelector('svg');
      sv.innerHTML = '<path d="M3.5 8.5l3 3 6-6.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>';
      setTimeout(function () {
        btn.classList.remove('copied');
        sv.innerHTML = '<rect x="5" y="5" width="8" height="8" rx="1.5"/><path d="M11 5V3.5A1.5 1.5 0 0 0 9.5 2h-6A1.5 1.5 0 0 0 2 3.5v6A1.5 1.5 0 0 0 3.5 11H5"/>';
      }, 1200);
    });

    li.appendChild(name);
    li.appendChild(valEl);
    li.appendChild(btn);
    return li;
  }

  function render() {
    var raw = numInput.value.trim();
    var val = parseFloat(raw);
    var unitIdx = parseInt(unitSelect.value, 10);
    var baseBytes = (!isNaN(val) && isFinite(val)) ? val * factorOf(unitDefs[unitIdx]) : 0;

    // 若选中的单位属于折叠区，则自动展开
    if (unitIdx > CUT) expanded = true;

    resultsMain.innerHTML = '';
    resultsMore.innerHTML = '';
    unitDefs.forEach(function (u, i) {
      var row = buildRow(u, i, unitIdx, baseBytes);
      if (i <= CUT) resultsMain.appendChild(row);
      else resultsMore.appendChild(row);
    });

    resultsMore.style.display = expanded ? '' : 'none';
    moreToggle.classList.toggle('open', expanded);
    moreToggle.innerHTML = (expanded ? '收起更多单位 ' : '展开更多单位 ') + '<span class="arrow">▾</span>';
  }

  moreToggle.addEventListener('click', function () {
    expanded = !expanded;
    render();
  });

  seg.addEventListener('click', function (e) {
    var btn = e.target.closest('.seg-btn');
    if (!btn) return;
    seg.querySelectorAll('.seg-btn').forEach(function (b) { b.classList.remove('active'); });
    btn.classList.add('active');
    base = (btn.dataset.mode === 'mac') ? 1000 : 1024;
    render();
  });

  numInput.addEventListener('input', render);
  unitSelect.addEventListener('change', render);
  render();
})();
</script>
