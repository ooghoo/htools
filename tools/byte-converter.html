<script>

  (function () {
    var de = document.documentElement;
    de.classList.add('js');
    try {
      var t = localStorage.getItem('htools:theme');
      if (t !== 'light' && t !== 'dark') {
        t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      de.setAttribute('data-theme', t);
      var m = document.getElementById('meta-theme');

  /* ================= 基础 ================= */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  [hidden] { display: none !important; }
  body {
    font-family: var(--font);
    font-size: 14px;
    line-height: 1.5;
    background: var(--background);
    color: var(--foreground);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    -webkit-tap-highlight-color: transparent;

  button { touch-action: manipulation; font-family: inherit; }
  a { color: inherit; }
  ::selection { background: hsl(235.65 84.93% 71.37% / .28); }

  /* ============================================================
     AppShell
     ============================================================ */
  .shell {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: linear-gradient(to bottom, var(--card) 0%, var(--brand-1) 52%, var(--brand-2) 100%);
  }

  .topbar {
    flex-shrink: 0;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 0 max(24px, env(safe-area-inset-right)) 0 max(24px, env(safe-area-inset-left));
  }
  .topbar-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .topbar-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

  .tbtn {
    width: 32px;
    height: 32px;
    border: none;
    border-radius: 6px;
    background: transparent;
    color: var(--foreground);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    text-decoration: none;
    flex-shrink: 0;
    transition: background-color .15s, color .15s, transform .1s;
  }
  .tbtn:hover { background: var(--accent); }
  .tbtn:active { transform: scale(.92); }
  .tbtn:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--ring); }
  .tbtn svg { width: 16px; height: 16px; }

  .brand { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--foreground); flex-shrink: 0; }
  .brand-mark {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    background: var(--foreground);
    color: var(--background);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .brand-mark svg { width: 14px; height: 14px; }
  .brand-name { font-size: 14px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; }

  .tbar-sep { width: 1px; height: 20px; background: var(--border); flex-shrink: 0; }
  .tbar-label { font-size: 13px; color: var(--muted-foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .theme-btn { position: relative; }

    display: inline-flex;
    transition: opacity .25s, transform .3s;

  .theme-btn .i-sun { opacity: 0; transform: rotate(-90deg) scale(.5); }
  html[data-theme="dark"] .theme-btn .i-moon { opacity: 0; transform: rotate(90deg) scale(.5); }
  html[data-theme="dark"] .theme-btn .i-sun { opacity: 1; transform: none; }

  .main-row {
    flex: 1;
    min-height: 0;
    display: flex;
    gap: 8px;
    padding: 0 max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));

  .sidebar-nav {

    min-height: 0;
    overflow-y: auto;
    scrollbar-gutter: stable;
    scrollbar-width: thin;
    scrollbar-color: var(--t-scrollbar) transparent;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .sidebar-nav::-webkit-scrollbar { width: 8px; }
  .sidebar-nav::-webkit-scrollbar-thumb {
    background: var(--t-scrollbar);
    border-radius: 999px;
    border: 2px solid transparent;
    background-clip: content-box;
  }
  .side-group { display: flex; flex-direction: column; gap: 2px; }
  .side-label { font-size: 12px; color: var(--muted-foreground); padding: 4px 8px; }
  .side-item {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 32px;
    padding: 0 8px;
    border-radius: 6px;
    font-size: 14px;
    color: var(--sidebar-foreground);
    text-decoration: none;
    white-space: nowrap;
    transition: background-color .15s, color .15s;
  }
  .side-item svg { width: 16px; height: 16px; flex-shrink: 0; color: var(--secondary-foreground); }
  .side-item:hover { background: var(--sidebar-accent); }
  .side-item.is-active { background: var(--brand-1); color: var(--sidebar-accent-foreground); font-weight: 500; }
  .side-item .side-dot {
    width: 6px; height: 6px; border-radius: 999px;

  .side-foot { flex-shrink: 0; font-size: 11.5px; line-height: 1.6; color: var(--muted-foreground); padding: 0 8px; }

  .content {
    position: relative;
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    border: 1px solid var(--brand-2);
    border-radius: var(--radius-panel);
    background: var(--background-95);
    box-shadow: 0 10px 15px -3px rgb(0 0 0 / .1), 0 4px 6px -4px rgb(0 0 0 / .1);
    overflow: hidden;
  }

  /* ---------- 页头栏：标题 + 描述，由注册表填充，不随滚动动 ---------- */
  .detail-bar {
    flex-shrink: 0;

    align-items: center;

  /* ---------- 内容滚动区 ---------- */
  .content-scroll {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    scrollbar-gutter: stable;
    scrollbar-width: thin;
    scrollbar-color: var(--t-scrollbar) transparent;
  }
  .content-scroll::-webkit-scrollbar { width: 8px; }

    border: 2px solid transparent;
    background-clip: content-box;

  .tool-body { display: flex; flex-direction: column; gap: 16px; }

  /* ============================================================
     工具样式（字节换算）：token 已重映射到设计体系

  /* 输入行：单个输入框 + 来源单位 */
  .conv-input {
    max-width: 560px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    gap: 8px;
  }
  .conv-input .ca-input::-webkit-outer-spin-button,
  .conv-input .ca-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .conv-input .ca-input { -moz-appearance: textfield; }
  .conv-input .ca-input {
    flex: 1;
    min-width: 0;
    height: 46px;
    font-size: 17px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    padding: 0 16px;
  }
  .conv-input .ca-select {
    width: 160px;
    flex-shrink: 0;
    height: 46px;
    font-size: 14px;
    font-weight: 500;
    padding: 0 40px 0 16px;
    background-position: right 14px center;
  }
  @media (max-width: 480px) {
    .conv-input { flex-direction: column; }
    .conv-input .ca-select { width: 100%; }
  }

  /* 单位卡片网格：列数只由视口宽度决定 */
  .unit-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 16px;
  }
  @media (min-width: 640px)  { .unit-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (min-width: 1024px) { .unit-grid { grid-template-columns: repeat(3, 1fr); } }
  @media (min-width: 1280px) { .unit-grid { grid-template-columns: repeat(4, 1fr); } }

  /* 单位卡片 */
  .ucard {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-card);
    padding: 16px;
    display: flex;
    flex-direction: column;

    font-weight: 500;

    padding: 1px 7px;

  .uval-rows { display: flex; flex-direction: column; gap: 8px; }
  .uval-row {

    align-items: center;

    border: 1px solid var(--border);
    border-radius: 8px;
    min-width: 0;

  .ucard.is-source .uval-row { background: var(--card); }
  .uval-label { font-size: 11.5px; color: var(--muted-foreground); flex-shrink: 0; }
  .uval-num {
    flex: 1;
    min-width: 0;
    text-align: right;
    font-family: var(--mono);
    font-size: 13.5px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    color: var(--foreground);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .uval-copy {
    flex-shrink: 0;
    width: 26px;
    height: 26px;
    border: none;
    border-radius: 6px;
    background: transparent;
    color: var(--muted-foreground);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    opacity: 0;
    transition: opacity .15s, background-color .15s, color .15s;
  }
  .uval-copy svg { width: 13px; height: 13px; }
  .uval-row:hover .uval-copy { opacity: 1; }
  .uval-copy:hover { background: var(--muted); color: var(--foreground); }
  .uval-copy:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--ring); }
  .uval-copy.is-done { opacity: 1; color: var(--brand-foreground); }
  @media (hover: none) { .uval-copy { opacity: 1; } }

  .ca-note { font-size: 12px; line-height: 1.6; color: var(--muted-foreground); }
  .ca-note code {
    font-family: var(--mono);
    font-size: 11px;
    background: var(--muted);
    padding: 1px 5px;
    border-radius: 4px;
  }
  .ca-note--center { text-align: center; max-width: 640px; margin: 0 auto; width: 100%; }

  .fold-wrap { display: flex; justify-content: center; }
  .fold-wrap .ca-btn svg { width: 14px; height: 14px; transition: transform .2s; }
  .fold-wrap .ca-btn.open svg { transform: rotate(180deg); }

  /* ---------- 窄屏：顶栏精简 ---------- */
  @media (max-width: 640px) {

  /* ---------- 移动端侧栏：覆盖抽屉 + 背景挡板 ---------- */
  .sidebar-backdrop {
    display: none;

    z-index: 40;

  @media (max-width: 767px) {
    .shell[data-sidebar="open"] .sidebar {

      border-radius: var(--radius-card);

  }
  @media (min-width: 768px) { .sidebar-backdrop { display: none !important; } }

  /* ================= 动效减弱 ================= */
  @media (prefers-reduced-motion: reduce) {
    .tbtn, .tbtn:active, .theme-btn .i, .side-item, .ca-input, .ca-select, .uval-copy {
      transition: none !important;
      transform: none !important;
    }
  }
</style>

              <div class="fold-wrap"><button class="ca-btn" id="fold-toggle" type="button"><span>展开更多单位</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v13M6 12.5l6 6 6-6"/></svg></button></div>

<script data-shell>
/* ============================================================
   外壳脚本：侧栏 / 深浅色 / 注册表路由 —— 全站共用，换页时不重复执行
   ============================================================ */
(function () {
  'use strict';

  var shell = document.getElementById('shell');
  var sidebarToggle = document.getElementById('sidebar-toggle');
  var sidebarBackdrop = document.getElementById('sidebar-backdrop');
  var sideTools = document.getElementById('side-tools');
  var favList = document.getElementById('fav-list');
  var favEmpty = document.getElementById('fav-empty');
  var tbarLabel = document.querySelector('[data-region="tbar-label"]');
  var contentScroll = document.querySelector('[data-region="content"]');
  var metaTheme = document.getElementById('meta-theme');
  var themeBtn = document.getElementById('theme-toggle');

  var ICONS = {
    byte: '<ellipse cx="12" cy="5.5" rx="7.5" ry="3"/><path d="M4.5 5.5v6c0 1.66 3.36 3 7.5 3s7.5-1.34 7.5-3v-6"/><path d="M4.5 11.5c0 1.66 3.36 3 7.5 3s7.5-1.34 7.5-3"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    code: '<path d="M9 8l-4 4 4 4M15 8l4 4-4 4"/>',
    text: '<path d="M4 6.5V5h16v1.5M12 5v14M8.5 19h7"/>',
    time: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3.5 2"/>',
    color: '<path d="M12 3.5c4.7 0 8.5 3.4 8.5 7.6 0 2.6-2 4.4-4.4 4.4h-2.3c-1 0-1.6.7-1.6 1.6 0 .5.2.9.2 1.4 0 .9-.7 1.5-1.5 1.5-4.4 0-7.9-3.7-7.9-8.2C3 6.9 6.9 3.5 12 3.5z"/><circle cx="8" cy="9.5" r="1.3" fill="currentColor" stroke="none"/><circle cx="12" cy="7.5" r="1.3" fill="currentColor" stroke="none"/><circle cx="16" cy="9.5" r="1.3" fill="currentColor" stroke="none"/>',
    image: '<rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="M3.5 16.5l4.5-4.5 4 3.5 3.5-3 5 4.5"/>'
  };

  var list = (typeof TOOLS !== 'undefined' && Array.isArray(TOOLS)) ? TOOLS : [];
  var toolItems = []; /* { a, tool } */
  window.htoolsIcons = ICONS; /* 页面脚本生成卡片图标用 */

  function iconSvg(inner, w) {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="' + (w || 1.6) + '" stroke-linecap="round" stroke-linejoin="round">' + inner + '</svg>';
  }
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function fileName(url) {
    return (url || '').split('#')[0].split('?')[0].split('/').pop() || '';
  }
  function isHomeUrl(url) {
    var f = fileName(url);
    return f === 'index.html' || f === '';
  }
  function findTool(file) {
    for (var i = 0; i < list.length; i++) {
      if ((list[i].file || '').split('/').pop() === file) return list[i];
    }
    return null;
  }

  /* ---------- 侧栏工具列表（注册表） ---------- */
  if (list.length) {
    list.forEach(function (t) {
      var a = document.createElement('a');
      a.className = 'side-item';
      a.setAttribute('data-nav', '');
      a.innerHTML =
        '<span class="side-dot" style="background-color:' + (t.accent || '#0071e3') + '"></span>' +
        '<span style="overflow:hidden;text-overflow:ellipsis">' + esc(t.name) + '</span>';
      sideTools.appendChild(a);
      toolItems.push({ a: a, tool: t });
    });
    sideTools.hidden = false;
  }

  /* ---------- 收藏（localStorage 持久化，侧栏快捷访问） ---------- */
  var FAV_KEY = 'htools:favs';
  var favs = new Set();
  try {
    var rawFavs = localStorage.getItem(FAV_KEY);
    if (rawFavs) JSON.parse(rawFavs).forEach(function (id) { favs.add(id); });
  } catch (e) {}
  function favId(t) { return t.id || t.file; }
  function saveFavs() {
    try { localStorage.setItem(FAV_KEY, JSON.stringify(Array.from(favs))); } catch (e) {}
  }
  function renderFavGroup() {
    if (!favList) return;
    favList.innerHTML = '';
    var favTools = list.filter(function (t) { return favs.has(favId(t)); });
    if (favEmpty) favEmpty.hidden = favTools.length > 0;
    favTools.forEach(function (t) {
      var row = document.createElement('div');
      row.className = 'side-item';

      var link = document.createElement('a');
      link.className = 'side-fav-link';
      link.setAttribute('data-nav', '');
      link.innerHTML =
        '<span class="side-tool-icon" style="background-color:' + (t.accent || '#0071e3') + '" aria-hidden="true">' +
          iconSvg(ICONS[t.icon] || ICONS.plus, 2) +
        '</span>' +
        '<span>' + esc(t.name) + '</span>';

      var remove = document.createElement('button');
      remove.type = 'button';
      remove.className = 'side-remove';
      remove.setAttribute('aria-label', '取消收藏 ' + t.name);
      remove.innerHTML = iconSvg('<path d="M18 6L6 18M6 6l12 12"/>', 2.4);
      remove.addEventListener('click', function () { toggleFav(t); });

      row.appendChild(link);
      row.appendChild(remove);
      favList.appendChild(row);
    });
  }
  function toggleFav(t) {
    var id = favId(t);
    if (favs.has(id)) favs.delete(id); else favs.add(id);
    saveFavs();
    renderFavGroup();
    if (typeof window.htoolsOnFavsChange === 'function') window.htoolsOnFavsChange();
  }
  window.htoolsIsFav = function (t) { return favs.has(favId(t)); };
  window.htoolsToggleFav = toggleFav;
  window.htoolsSyncFavs = renderFavGroup;

  /* ---------- 路由同步：侧栏高亮 / 标签 / 页头栏 / 标题 ---------- */
  function syncRoute(url) {
    var isHome = isHomeUrl(url);
    var file = fileName(url) || 'index.html';
    var t = findTool(file);

    Array.prototype.forEach.call(document.querySelectorAll('#sidebar .side-item'), function (a) {
      var f2 = fileName(a.getAttribute('href') || '');
      var active = isHome ? (f2 === 'index.html') : (f2 === file);
      a.classList.toggle('is-active', active);
      if (active) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });

    if (tbarLabel) tbarLabel.textContent = isHome ? '单文件小工具合集' : (t ? t.name : '工具名称');

    var db = document.querySelector('[data-region="detail-bar"]');
    if (db) {
      if (!isHome && t) {
        var n = db.querySelector('[data-region="detail-name"]');
        var d = db.querySelector('[data-region="detail-desc"]');
        if (n) n.textContent = t.name;
        if (d) d.textContent = t.desc;
        db.hidden = false;
      } else {
        db.hidden = true;
      }
    }
    document.title = isHome ? 'htools · HTML 小工具合集' : (t ? t.name + ' · htools' : 'htools');
  }

  /* ---------- 侧栏链接按当前目录重写（SPA 换页后相对路径保持正确） ---------- */
  function syncSidebarHrefs(url) {
    var dir = url.split('#')[0].split('?')[0].split('/').slice(0, -1).join('/') + '/';
    toolItems.forEach(function (it) { it.a.href = dir + it.tool.file; });
    Array.prototype.forEach.call(document.querySelectorAll('#sidebar a[data-home]'), function (a) {
      a.href = dir + 'index.html#tools';
    });
    var brand = document.querySelector('.topbar .brand');
    if (brand) brand.href = dir + 'index.html';
  }

  /* ---------- 页面级监听登记（换页时自动移除） ---------- */
  var pageCleanups = [];
  function onPageCleanup(fn) { pageCleanups.push(fn); }
  function onPageEvent(target, type, fn, opts) {
    target.addEventListener(type, fn, opts);
    onPageCleanup(function () { target.removeEventListener(type, fn, opts); });
  }
  function runPageCleanups() {
    pageCleanups.splice(0).forEach(function (fn) { try { fn(); } catch (e) {} });
  }
  window.htoolsPageEvent = onPageEvent;
  window.htoolsOnPageCleanup = onPageCleanup;

  /* ---------- 侧栏开合 ---------- */
  var mqWide = window.matchMedia('(min-width: 90rem)');
  var userTookOver = false;

  function setSidebar(open) {
    shell.setAttribute('data-sidebar', open ? 'open' : 'closed');
    sidebarToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    sidebarToggle.setAttribute('aria-label', open ? '收起侧栏' : '展开侧栏');
  }
  function syncSidebar() {
    if (!userTookOver) setSidebar(mqWide.matches);
  }
  sidebarToggle.addEventListener('click', function () {
    userTookOver = true;
    setSidebar(shell.getAttribute('data-sidebar') !== 'open');
  });
  sidebarBackdrop.addEventListener('click', function () {
    userTookOver = true;
    setSidebar(false);
  });
  if (typeof mqWide.addEventListener === 'function') {
    mqWide.addEventListener('change', syncSidebar);
  }
  syncSidebar();

  /* ---------- 深浅色：默认跟随系统，手动选择后记住并停止跟随 ---------- */
  var mqDark = window.matchMedia('(prefers-color-scheme: dark)');
  function storedTheme() {
    try { return localStorage.getItem('htools:theme'); } catch (e) { return null; }
  }
  function currentTheme() {
    return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  }
  function applyTheme(t, persist) {
    document.documentElement.setAttribute('data-theme', t);
    if (metaTheme) metaTheme.setAttribute('content', t === 'dark' ? '#0a0a0a' : '#fbfbfc');
    if (persist) {
      try { localStorage.setItem('htools:theme', t); } catch (e) {}
    }
  }
  applyTheme(currentTheme(), false);
  themeBtn.addEventListener('click', function () {
    applyTheme(currentTheme() === 'dark' ? 'light' : 'dark', true);
  });
  if (typeof mqDark.addEventListener === 'function') {
    mqDark.addEventListener('change', function (e) {
      if (!storedTheme()) applyTheme(e.matches ? 'dark' : 'light', false);
    });
  }

  /* ---------- "/" 聚焦搜索（首页存在搜索框时生效） ---------- */
  document.addEventListener('keydown', function (e) {
    if (e.key !== '/' || e.metaKey || e.ctrlKey || e.altKey) return;
    var ae = document.activeElement;
    if (ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)) return;
    var si = document.getElementById('search-input');
    if (!si) return;
    e.preventDefault();
    si.focus();
  });

  /* ---------- SPA 路由：fetch 局部换页；file:// 自动退回整页跳转 ---------- */
  var SPA = location.protocol === 'http:' || location.protocol === 'https:';

  function runPageScripts(doc) {
    Array.prototype.forEach.call(doc.querySelectorAll('script[data-page]'), function (old) {
      var s = document.createElement('script');
      s.textContent = old.textContent;
      document.body.appendChild(s);
    });
  }

  function applyRoute(url, push) {
    runPageCleanups();
    fetch(url, { credentials: 'same-origin' }).then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.text();
    }).then(function (html) {
      var doc = new DOMParser().parseFromString(html, 'text/html');

      /* 页面样式：移除上一页注入的，注入本页的 */
      Array.prototype.forEach.call(document.querySelectorAll('style[data-injected]'), function (s) {
        s.parentNode.removeChild(s);
      });
      Array.prototype.forEach.call(doc.querySelectorAll('style[data-page-style]'), function (old) {
        var s = document.createElement('style');
        s.setAttribute('data-injected', '');
        s.textContent = old.textContent;
        document.head.appendChild(s);
      });

      var lbl = doc.querySelector('[data-region="tbar-label"]');
      if (lbl && tbarLabel) tbarLabel.textContent = lbl.textContent;

      var c = doc.querySelector('[data-region="content"]');
      if (c && contentScroll) contentScroll.innerHTML = c.innerHTML;

      var db = doc.querySelector('[data-region="detail-bar"]');
      var myDb = document.querySelector('[data-region="detail-bar"]');
      if (myDb) {
        if (db) { myDb.innerHTML = db.innerHTML; myDb.hidden = false; }
        else { myDb.hidden = true; }
      }

      runPageScripts(doc);
      syncRoute(url);
      syncSidebarHrefs(url);

      var hash = url.split('#')[1] || '';
      if (contentScroll) {
        if (hash) {
          var target = document.getElementById(hash);
          if (target) {
            contentScroll.scrollTop = target.getBoundingClientRect().top
              - contentScroll.getBoundingClientRect().top
              + contentScroll.scrollTop - 8;
          } else contentScroll.scrollTop = 0;
        } else contentScroll.scrollTop = 0;
      }
      if (push) {
        try { history.pushState({ htools: 1 }, '', url); } catch (e) {}
      }
    }).catch(function () {
      location.href = url;
    });
  }

  if (SPA) {
    document.addEventListener('click', function (e) {
      var a = e.target && e.target.closest ? e.target.closest('a[data-nav]') : null;
      if (!a) return;
      if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button !== 0) return;
      var href = a.getAttribute('href');
      if (!href || href.charAt(0) === '#') return;
      e.preventDefault();
      applyRoute(href, true);
    });
    window.addEventListener('popstate', function () {
      applyRoute(location.href, false);
    });
  }

  /* ---------- 启动 ---------- */
  renderFavGroup();
  syncRoute(location.href);
  syncSidebarHrefs(location.href);
})();
</script>
<script data-page>
/* ============================================================
   工具脚本（字节换算）：一次输入，同时输出两种进制的全部单位
   ============================================================ */
(function () {
  'use strict';

  var unitDefs = [
    { key: 'bit', name: '比特',   sym: 'bit', power: null }, // bit = Byte × 8
    { key: 'B',   name: '字节',   sym: 'B',   power: 0 },
    { key: 'KB',  name: '千字节', sym: 'KB',  power: 1 },
    { key: 'MB',  name: '兆字节', sym: 'MB',  power: 2 },
    { key: 'GB',  name: '千兆字节', sym: 'GB', power: 3 },
    { key: 'TB',  name: '太字节', sym: 'TB',  power: 4 },
    { key: 'PB',  name: '拍字节', sym: 'PB',  power: 5 },
    { key: 'EB',  name: '艾字节', sym: 'EB',  power: 6 },
    { key: 'ZB',  name: '泽字节', sym: 'ZB',  power: 7 },
    { key: 'YB',  name: '尧字节', sym: 'YB',  power: 8 }
  ];
  var BASES = [
    { label: '二进制 · 1024', base: 1024 },
    { label: '十进制 · 1000', base: 1000 }
  ];

  var numInput = document.getElementById('numInput');
  var unitSelect = document.getElementById('unitSelect');
  var unitGrid = document.getElementById('unitGrid');

  var state = { value: 1, unit: 1 }; // 默认 1 字节
  var cards = [];                    /* { data, cells: [numEl × 2], copyBtns } */

  function factorOf(def, base) {
    if (def.power === null) return 1 / 8; // bit = Byte / 8
    return Math.pow(base, def.power);
  }

  function fmt(v) {
    if (v === 0) return '0.00';
    if (!isFinite(v)) return '—';
    var abs = Math.abs(v);
    if ((abs > 0 && abs < 0.0005) || abs >= 1e15) {
      return v.toExponential(2).replace('e+', 'e');
    }
    return v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  /* ---------- 生成来源单位下拉 ---------- */
  unitDefs.forEach(function (u, i) {
    var opt = document.createElement('option');
    opt.value = i;
    opt.textContent = u.name + ' (' + u.sym + ')';
    unitSelect.appendChild(opt);
  });
  unitSelect.value = 1; // 默认：字节 B

  /* ---------- 生成单位卡片（一次构建，之后只更新数值） ---------- */
  var COPY_SVG = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="8" height="8" rx="1.5"/><path d="M11 5V3.5A1.5 1.5 0 0 0 9.5 2h-6A1.5 1.5 0 0 0 2 3.5v6A1.5 1.5 0 0 0 3.5 11H5"/></svg>';
  var DONE_SVG = '<path d="M3.5 8.5l3 3 6-6.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>';

  function buildCard(def, index) {
    var card = document.createElement('article');
    card.className = 'ucard';

    var head = document.createElement('div');
    head.className = 'ucard-head';
    head.innerHTML =
      '<span class="ucard-sym">' + def.sym + '</span>' +
      '<span class="ucard-name">' + def.name + '</span>';
    card.appendChild(head);

    var rows = [];
    var btns = [];
    var valsWrap = document.createElement('div');
    valsWrap.className = 'uval-rows';

    BASES.forEach(function (b, bi) {
      var row = document.createElement('div');
      row.className = 'uval-row';
      row.innerHTML = '<span class="uval-label">' + b.label + '</span>';
      var num = document.createElement('span');
      num.className = 'uval-num';
      num.textContent = '0.00';
      row.appendChild(num);

      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'uval-copy';
      btn.title = '复制';
      btn.setAttribute('aria-label', '复制 ' + def.name + ' ' + b.label + ' 的值');
      btn.innerHTML = COPY_SVG;
      btn.addEventListener('click', function () {
        var text = num.textContent;
        var tmp = document.createElement('textarea');
        tmp.value = text;
        document.body.appendChild(tmp);
        tmp.select();
        try { document.execCommand('copy'); } catch (e) {}
        document.body.removeChild(tmp);
        btn.classList.add('is-done');
        btn.innerHTML = DONE_SVG;
        setTimeout(function () {
          btn.classList.remove('is-done');
          btn.innerHTML = COPY_SVG;
        }, 1200);
      });
      row.appendChild(btn);

      valsWrap.appendChild(row);
      rows.push(num);
      btns.push(btn);
    });
    card.appendChild(valsWrap);

    return { data: def, index: index, el: card, head: head, rows: rows, btns: btns };
  }

  unitDefs.forEach(function (def, i) {
    var c = buildCard(def, i);
    unitGrid.appendChild(c.el);
    cards.push(c);
  });

  /* ZB / YB 默认折叠 */
  var FOLD_KEYS = ['ZB', 'YB'];
  var expanded = false;
  var foldBtn = document.getElementById('fold-toggle');
  function applyFold() {
    cards.forEach(function (c) {
      if (FOLD_KEYS.indexOf(c.data.key) !== -1) c.el.hidden = !expanded;
    });
    var span = foldBtn.querySelector('span');
    if (span) span.textContent = expanded ? '收起更高单位' : '展开更多单位';
    foldBtn.classList.toggle('open', expanded);
  }
  foldBtn.addEventListener('click', function () { expanded = !expanded; applyFold(); });

  /* ---------- 渲染：每个单位给出两种进制的值 ---------- */
  function render() {
    var raw = numInput.value.trim();
    var val = parseFloat(raw);
    var srcIdx = parseInt(unitSelect.value, 10) || 0;
    var srcDef = unitDefs[srcIdx];
    var valid = !isNaN(val) && isFinite(val);

    cards.forEach(function (c) {
      var isSource = c.index === srcIdx;
      c.el.classList.toggle('is-source', isSource);
      // 来源徽标
      var badge = c.head.querySelector('.ucard-badge');
      if (isSource && !badge) {
        badge = document.createElement('span');
        badge.className = 'ucard-badge';
        badge.textContent = '输入单位';
        c.head.appendChild(badge);
      } else if (!isSource && badge) {
        badge.remove();
      }

      BASES.forEach(function (b, bi) {
        var srcFactor = factorOf(srcDef, b.base);       // 输入单位 → Byte
        var dstFactor = factorOf(c.data, b.base);       // Byte → 目标单位
        var bytes = valid ? val * srcFactor : 0;
        var out = bytes / dstFactor;
        c.rows[bi].textContent = fmt(out);
      });
      if (srcDef && FOLD_KEYS.indexOf(srcDef.key) !== -1) expanded = true;
      applyFold();
    });
  }

  numInput.addEventListener('input', render);
  unitSelect.addEventListener('change', render);
  render();
})();
</script>
</body>
</html>
