<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>htools · 个人 Web 工具集</title>
    <meta name="description" content="纯前端、离线可用的个人 Web 工具集：颜色转换、JSON 格式化、时间戳转换、字节换算、Base64 编解码、图片水印。" />
    <meta name="theme-color" content="#fbfbfc" id="meta-theme" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%2317191B'/><path d='M10 8.6v14.8M10 17.4c0-3.2 2.7-5.6 6.2-5.6s6.2 2.4 6.2 5.6v6' fill='none' stroke='%23FFFFFF' stroke-width='3.4' stroke-linecap='round'/></svg>"
    />
    <script>
      /* 主题预置：在首帧之前定好 data-theme，避免刷新时闪白。
         与 src/hooks/useTheme.ts 使用同一个存储键，逻辑保持一致。 */
      (function () {
        var de = document.documentElement
        var t = null
        try {
          t = localStorage.getItem('htools:theme')
        } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        de.setAttribute('data-theme', t)
        var m = document.getElementById('meta-theme')
        if (m) m.setAttribute('content', t === 'dark' ? '#0a0a0a' : '#fbfbfc')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 24px; font: 14px/1.6 -apple-system, sans-serif">
        本工具集是纯前端应用，需要启用 JavaScript 才能使用。
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
