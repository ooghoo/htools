<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>HTML 小工具 · Web Tools</title>
<meta name="description" content="一个纯前端、零依赖、离线可用的 HTML 小工具合集。">
<meta name="theme-color" content="#f5f5f7" id="meta-theme">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230071e3'/><path d='M13 12l-2.5 4L13 20M19 12l2.5 4L19 20' stroke='white' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<script>
  /* 主题预置：在样式表加载前定好 data-theme，避免刷新闪白/闪黑 */
  (function () {
    try {
      var t = localStorage.getItem('htools:theme');
      if (t !== 'light' && t !== 'dark') {
        t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', t);
      var m = document.getElementById('meta-theme');
      if (m) m.setAttribute('content', t === 'dark' ? '#000000' : '#f5f5f7');
    } catch (e) {}
  })();
</script>
<style>
  /* ================= 设计变量 ================= */
  :root {
    color-scheme: light;

    --bg: #f5f5f7;
    --card: #ffffff;
    --text: #1d1d1f;
    --text-2: #6e6e73;
    --text-3: #86868b;
    --line: rgba(0, 0, 0, .09);
    --line-2: rgba(0, 0, 0, .05);
    --nav-bg: rgba(255, 255, 255, .72);
    --field: #e9e9ed;
    --field-focus: #ffffff;
    --chip: rgba(0, 0, 0, .05);
    --hover-border: rgba(0, 0, 0, .12);
    --focus-ring: rgba(0, 113, 227, .32);
    --accent: #0071e3;

    --shadow: 0 1px 1px rgba(0, 0, 0, .03), 0 4px 12px rgba(0, 0, 0, .04), 0 12px 28px rgba(0, 0, 0, .03);
    --shadow-hover: 0 2px 4px rgba(0, 0, 0, .04), 0 12px 28px rgba(0, 0, 0, .07), 0 28px 60px rgba(0, 0, 0, .07);

    --radius-lg: 20px;
    --radius-icon: 13px;
    --pad: clamp(20px, 2.2vw, 24px);
    --nav-h: 48px;

    --ease: cubic-bezier(.25, .8, .25, 1);
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang SC", "Helvetica Neue", "Segoe UI", sans-serif;
    --mono: "SF Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  html[data-theme="dark"] {
    color-scheme: dark;

    --bg: #000000;
    --card: #1d1d1f;
    --text: #f5f5f7;
    --text-2: #a1a1a6;
    --text-3: #86868b;
    --line: rgba(255, 255, 255, .13);
    --line-2: rgba(255, 255, 255, .08);
    --nav-bg: rgba(22, 22, 23, .72);
    --field: #1d1d1f;
    --field-focus: #1d1d1f;
    --chip: rgba(255, 255, 255, .08);
    --hover-border: rgba(255, 255, 255, .18);
    --focus-ring: rgba(10, 132, 255, .38);
    --accent: #0a84ff;

    --shadow: 0 1px 1px rgba(0, 0, 0, .3), 0 4px 12px rgba(0, 0, 0, .24), 0 12px 28px rgba(0, 0, 0, .18);
    --shadow-hover: 0 2px 4px rgba(0, 0, 0, .32), 0 12px 28px rgba(0, 0, 0, .3), 0 28px 60px rgba(0, 0, 0, .28);
  }

  /* ================= 基础 ================= */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  html, body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  body {
    min-height: 100vh;
    -webkit-tap-highlight-color: transparent;
    transition: background-color .3s var(--ease), color .3s var(--ease);
  }
  button { touch-action: manipulation; font-family: inherit; }
  ::selection { background: rgba(0, 113, 227, .2); }
  html[data-theme="dark"] ::selection { background: rgba(10, 132, 255, .3); }

  /* ================= 顶部磨砂导航 ================= */
  .nav {
    position: fixed;
    inset: 0 0 auto 0;
    z-index: 100;
    padding-top: env(safe-area-inset-top);
    background: var(--nav-bg);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid var(--line-2);
  }
  .nav-inner {
    max-width: 1024px;
    height: var(--nav-h);
    margin: 0 auto;
    padding: 0 max(20px, env(safe-area-inset-right)) 0 max(20px, env(safe-area-inset-left));
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 9px;
    text-decoration: none;
    color: var(--text);
  }
  .brand-logo {
    width: 26px;
    height: 26px;
    border-radius: 8px;
    background: linear-gradient(150deg, #5aa9ff, #0071e3);
    box-shadow: 0 3px 8px rgba(0, 113, 227, .28), inset 0 1px 0 rgba(255, 255, 255, .35);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    flex-shrink: 0;
  }
  .brand-logo svg { width: 14px; height: 14px; }
  .brand-name {
    font-size: 14.5px;
    font-weight: 600;
    letter-spacing: -0.2px;
    white-space: nowrap;
  }
  .nav-actions { display: flex; align-items: center; gap: 2px; }
  .icon-btn {
    position: relative;
    width: 36px;
    height: 36px;
    border: none;
    border-radius: 10px;
    background: transparent;
    color: var(--text-2);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    text-decoration: none;
    transition: color .2s var(--ease), background-color .2s var(--ease), transform .15s var(--ease);
  }
  .icon-btn:hover { color: var(--text); background: var(--chip); }
  .icon-btn:active { transform: scale(.9); }
  .icon-btn:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--focus-ring); }
  .icon-btn svg { width: 17px; height: 17px; }

  /* 深浅色切换：日月图标交叉淡入淡出 */
  .theme-btn .i {
    position: absolute;
    display: flex;
    transition: opacity .25s var(--ease), transform .3s var(--ease);
  }
  .theme-btn .i-moon { opacity: 1; transform: none; }
  .theme-btn .i-sun { opacity: 0; transform: rotate(-90deg) scale(.5); }
  html[data-theme="dark"] .theme-btn .i-moon { opacity: 0; transform: rotate(90deg) scale(.5); }
  html[data-theme="dark"] .theme-btn .i-sun { opacity: 1; transform: none; }

  /* ================= 版心 ================= */
  .wrap {
    max-width: 1024px;
    margin: 0 auto;
    padding:
      calc(var(--nav-h) + env(safe-area-inset-top) + clamp(48px, 10vw, 96px))
      max(20px, env(safe-area-inset-right))
      clamp(40px, 6vw, 64px)
      max(20px, env(safe-area-inset-left));
  }

  /* ================= Hero ================= */
  .hero { text-align: center; max-width: 680px; margin: 0 auto; }
  .hero-logo {
    width: clamp(60px, 9vw, 72px);
    height: clamp(60px, 9vw, 72px);
    border-radius: 20px;
    margin: 0 auto clamp(20px, 3vw, 28px);
    background: linear-gradient(150deg, #5aa9ff, #0071e3);
    box-shadow: 0 12px 32px rgba(0, 113, 227, .32), inset 0 1.5px 0 rgba(255, 255, 255, .4);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
  }
  .hero-logo svg { width: 45%; height: 45%; }
  h1 {
    font-size: clamp(34px, 6vw, 52px);
    font-weight: 700;
    letter-spacing: -0.025em;
    line-height: 1.1;
  }
  .hero-sub {
    margin-top: clamp(12px, 2vw, 18px);
    font-size: clamp(15px, 1.8vw, 19px);
    line-height: 1.6;
    letter-spacing: -0.01em;
    color: var(--text-2);
  }
  .chips {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: clamp(18px, 2.6vw, 26px);
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 30px;
    padding: 0 13px;
    border-radius: 999px;
    background: var(--chip);
    font-size: 12.5px;
    font-weight: 500;
    color: var(--text-2);
    white-space: nowrap;
  }
  .chip svg { width: 13px; height: 13px; color: var(--accent); flex-shrink: 0; }

  /* ================= 搜索 ================= */
  .search {
    position: relative;
    max-width: 520px;
    margin: clamp(36px, 6vw, 56px) auto clamp(28px, 4vw, 40px);
  }
  .search-icon {
    position: absolute;
    left: 15px;
    top: 50%;
    transform: translateY(-50%);
    width: 16px;
    height: 16px;
    color: var(--text-3);
    pointer-events: none;
    transition: color .2s var(--ease);
  }
  .search:focus-within .search-icon { color: var(--accent); }
  .search input {
    width: 100%;
    height: 44px;
    border: none;
    border-radius: 999px;
    background: var(--field);
    color: var(--text);
    font-size: 16px; /* ≥16px 避免 iOS 聚焦自动放大 */
    font-family: inherit;
    padding: 0 44px 0 42px;
    outline: none;
    -webkit-appearance: none;
    appearance: none;
    transition: background-color .25s var(--ease), box-shadow .25s var(--ease);
  }
  .search input::placeholder { color: var(--text-3); }
  .search input:focus { background: var(--field-focus); box-shadow: 0 0 0 2px var(--accent); }
  .search-hint {
    position: absolute;
    right: 13px;
    top: 50%;
    transform: translateY(-50%);
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--text-3);
    background: var(--chip);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 1px 7px;
    pointer-events: none;
    transition: opacity .2s var(--ease);
  }
  .search-clear {
    position: absolute;
    right: 7px;
    top: 50%;
    transform: translateY(-50%);
    width: 30px;
    height: 30px;
    border: none;
    border-radius: 999px;
    background: var(--chip);
    color: var(--text-2);
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    transition: background-color .2s var(--ease), color .2s var(--ease), transform .15s var(--ease);
  }
  .search-clear.show { display: flex; }
  .search-clear:hover { color: var(--text); }
  .search-clear:active { transform: translateY(-50%) scale(.88); }
  .search-clear:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--focus-ring); }
  .search-clear svg { width: 12px; height: 12px; }
  @media (hover: none) { .search-hint { display: none; } }

  /* ================= 分组标题 ================= */
  .sec-head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: clamp(14px, 2vw, 20px);
  }
  .sec-head h2 {
    font-size: clamp(19px, 2.2vw, 23px);
    font-weight: 600;
    letter-spacing: -0.3px;
  }
  .sec-count {
    font-size: 12.5px;
    font-weight: 500;
    color: var(--text-2);
    background: var(--chip);
    border-radius: 999px;
    padding: 3px 10px;
    font-variant-numeric: tabular-nums;
  }

  /* ================= 工具网格：列数只由视口宽度决定 ================= */
  .grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: clamp(14px, 1.8vw, 20px);
  }
  @media (min-width: 640px)  { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (min-width: 1024px) { .grid { grid-template-columns: repeat(3, 1fr); } }

  /* ================= 工具卡片 ================= */
  .tool {
    position: relative;
    display: flex;
    flex-direction: column;
    padding: var(--pad);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
    text-decoration: none;
    color: inherit;
    /* 入场（opacity/transform）+ 悬停（transform/box-shadow/border）共用一个过渡 */
    transition:
      transform .35s var(--ease),
      box-shadow .35s var(--ease),
      border-color .35s var(--ease),
      background-color .3s var(--ease),
      opacity .5s var(--ease);
    opacity: 0;
    transform: translateY(14px);
  }
  .tool.in { opacity: 1; transform: none; }
  @media (hover: hover) {
    .tool:hover {
      transform: translateY(-5px);
      box-shadow: var(--shadow-hover);
      border-color: var(--hover-border);
    }
  }
  .tool:active { transform: translateY(-1px); }
  .tool:focus-visible {
    outline: none;
    box-shadow: 0 0 0 4px var(--focus-ring), var(--shadow);
  }

  .t-icon {
    flex-shrink: 0;
    width: 46px;
    height: 46px;
    border-radius: var(--radius-icon);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    background-image: linear-gradient(150deg, rgba(255, 255, 255, .32), rgba(255, 255, 255, 0) 62%);
    box-shadow: 0 4px 12px rgba(0, 0, 0, .14), inset 0 1px 0 rgba(255, 255, 255, .25);
  }
  .t-icon svg { width: 23px; height: 23px; }

  .t-arrow {
    position: absolute;
    top: var(--pad);
    right: var(--pad);
    width: 20px;
    height: 20px;
    color: var(--text-3);
    transition: color .25s var(--ease), transform .25s var(--ease);
  }
  .tool:hover .t-arrow { color: var(--accent); transform: translateX(3px); }

  .t-name {
    margin-top: 14px;
    padding-right: 28px;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.2px;
    line-height: 1.3;
  }
  .t-desc {
    margin-top: 6px;
    font-size: 13.5px;
    line-height: 1.6;
    color: var(--text-2);
    flex: 1;
  }
  .t-file {
    margin-top: 18px;
    padding-top: 13px;
    border-top: 1px solid var(--line-2);
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--text-3);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* ================= 空状态 ================= */
  .empty {
    padding: 52px 24px;
    text-align: center;
    border: 1px dashed var(--line);
    border-radius: var(--radius-lg);
  }
  .empty-icon {
    width: 40px;
    height: 40px;
    margin: 0 auto 14px;
    color: var(--text-3);
  }
  .empty-icon svg { width: 100%; height: 100%; }
  .empty-title { font-size: 15px; font-weight: 600; color: var(--text); }
  .empty-desc { margin-top: 6px; font-size: 13px; color: var(--text-3); line-height: 1.6; }
  .empty-reset {
    margin-top: 18px;
    height: 32px;
    padding: 0 16px;
    border: none;
    border-radius: 999px;
    background: var(--accent);
    color: #fff;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: opacity .2s var(--ease), transform .15s var(--ease);
  }
  .empty-reset:hover { opacity: .85; }
  .empty-reset:active { transform: scale(.96); }
  .empty-reset:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--focus-ring); }

  .noscript {
    padding: 44px 24px;
    text-align: center;
    font-size: 13.5px;
    color: var(--text-3);
    border: 1px dashed var(--line);
    border-radius: var(--radius-lg);
  }

  /* ================= 页脚 ================= */
  .foot {
    max-width: 1024px;
    margin: 0 auto;
    padding:
      clamp(22px, 3vw, 30px)
      max(20px, env(safe-area-inset-right))
      calc(clamp(30px, 4vw, 48px) + env(safe-area-inset-bottom))
      max(20px, env(safe-area-inset-left));
    border-top: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    font-size: 12.5px;
    color: var(--text-3);
  }
  .foot a {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--text-2);
    text-decoration: none;
    transition: color .2s var(--ease);
  }
  .foot a:hover { color: var(--accent); }
  .foot svg { width: 15px; height: 15px; }

  /* ================= 动效减弱 ================= */
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .tool, .tool.in { opacity: 1; transform: none; transition: none; }
    .tool:hover, .tool:active { transform: none; }
    .t-arrow, .theme-btn .i { transition: none; }
  }
</style>
</head>
<body>
  <nav class="nav" aria-label="主导航">
    <div class="nav-inner">
      <a class="brand" href="index.html">
        <span class="brand-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2.5" y="2.5" width="19" height="19" rx="5"/>
            <path d="M9 10.5L7 12.5l2 2M15 10.5l2 2-2 2"/>
          </svg>
        </span>
        <span class="brand-name">HTML 小工具</span>
      </a>
      <div class="nav-actions">
        <a class="icon-btn" href="https://github.com/ooghoo/htools" target="_blank" rel="noopener" aria-label="GitHub 仓库">
          <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.4 7.4 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
          </svg>
        </a>
        <button class="icon-btn theme-btn" id="theme-toggle" aria-label="切换深浅色模式">
          <span class="i i-moon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 8.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </span>
          <span class="i i-sun" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
          </span>
        </button>
      </div>
    </div>
  </nav>

  <main class="wrap">
    <header class="hero">
      <div class="hero-logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2.5" y="2.5" width="19" height="19" rx="5"/>
          <path d="M9 10.5L7 12.5l2 2M15 10.5l2 2-2 2"/>
        </svg>
      </div>
      <h1>HTML 小工具</h1>
      <p class="hero-sub">纯前端、零依赖的单文件小工具合集。不起服务、不联网，双击就能用。</p>
      <div class="chips">
        <span class="chip">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>
          单文件
        </span>
        <span class="chip">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/></svg>
          零依赖
        </span>
        <span class="chip">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M8.5 16.5a5 5 0 0 1 7 0"/><path d="M5 12.9a10 10 0 0 1 5.2-2.9"/><path d="M14 12.9c1.6.7 3 1.9 4 3.1"/><path d="M1.6 8.6a15 15 0 0 1 6.2-3.7"/><path d="M16.2 5a15 15 0 0 1 6.2 3.6"/></svg>
          离线可用
        </span>
      </div>
    </header>

    <div class="search" role="search">
      <span class="search-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
      </span>
      <input id="search-input" type="text" placeholder="搜索工具…" aria-label="搜索工具" autocomplete="off" spellcheck="false">
      <span class="search-hint" id="search-hint" aria-hidden="true">/</span>
      <button class="search-clear" id="search-clear" aria-label="清除搜索">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <section class="tools" aria-label="工具列表">
      <div class="sec-head">
        <h2>全部工具</h2>
        <span class="sec-count" id="count" aria-live="polite">0</span>
      </div>
      <div class="grid" id="grid">
        <noscript><p class="noscript">启用 JavaScript 后，这里会列出全部工具。</p></noscript>
      </div>
      <div class="empty" id="empty" hidden>
        <div class="empty-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/><path d="M8.5 8.5l5 5M13.5 8.5l-5 5"/></svg>
        </div>
        <p class="empty-title" id="empty-title"></p>
        <p class="empty-desc" id="empty-desc"></p>
        <button class="empty-reset" id="empty-reset" hidden>清除搜索</button>
      </div>
    </section>
  </main>

  <footer class="foot">
    <div>单文件 · 零依赖 · 离线可用</div>
    <a href="https://github.com/ooghoo/htools" target="_blank" rel="noopener">
      <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.4 7.4 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
      </svg>
      GitHub
    </a>
  </footer>

<script src="tools.js"></script>
<script>
(function () {
  'use strict';

  /* ---------- 图标库（新增工具时在这里补图标） ---------- */
  var ICONS = {
    byte: '<ellipse cx="12" cy="5.5" rx="7.5" ry="3"/><path d="M4.5 5.5v6c0 1.66 3.36 3 7.5 3s7.5-1.34 7.5-3v-6"/><path d="M4.5 11.5c0 1.66 3.36 3 7.5 3s7.5-1.34 7.5-3"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    code: '<path d="M9 8l-4 4 4 4M15 8l4 4-4 4"/>',
    text: '<path d="M4 6.5V5h16v1.5M12 5v14M8.5 19h7"/>',
    time: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3.5 2"/>',
    color: '<path d="M12 3.5c4.7 0 8.5 3.4 8.5 7.6 0 2.6-2 4.4-4.4 4.4h-2.3c-1 0-1.6.7-1.6 1.6 0 .5.2.9.2 1.4 0 .9-.7 1.5-1.5 1.5-4.4 0-7.9-3.7-7.9-8.2C3 6.9 6.9 3.5 12 3.5z"/><circle cx="8" cy="9.5" r="1.3" fill="currentColor" stroke="none"/><circle cx="12" cy="7.5" r="1.3" fill="currentColor" stroke="none"/><circle cx="16" cy="9.5" r="1.3" fill="currentColor" stroke="none"/>',
    image: '<rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="M3.5 16.5l4.5-4.5 4 3.5 3.5-3 5 4.5"/>'
  };

  var grid = document.getElementById('grid');
  var countEl = document.getElementById('count');
  var emptyEl = document.getElementById('empty');
  var emptyTitle = document.getElementById('empty-title');
  var emptyDesc = document.getElementById('empty-desc');
  var emptyReset = document.getElementById('empty-reset');
  var searchInput = document.getElementById('search-input');
  var searchClear = document.getElementById('search-clear');
  var searchHint = document.getElementById('search-hint');
  var metaTheme = document.getElementById('meta-theme');
  var themeBtn = document.getElementById('theme-toggle');

  var list = (typeof TOOLS !== 'undefined' && Array.isArray(TOOLS)) ? TOOLS : [];
  var cards = [];
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function iconSvg(inner, w) {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="' + (w || 1.6) + '" stroke-linecap="round" stroke-linejoin="round">' + inner + '</svg>';
  }

  function buildCard(t) {
    var a = document.createElement('a');
    a.className = 'tool';
    a.href = t.file;

    var icon = document.createElement('span');
    icon.className = 't-icon';
    icon.style.backgroundColor = t.accent || '#0071e3';
    icon.setAttribute('aria-hidden', 'true');
    icon.innerHTML = iconSvg(ICONS[t.icon] || ICONS.plus);

    var arrow = document.createElement('span');
    arrow.className = 't-arrow';
    arrow.setAttribute('aria-hidden', 'true');
    arrow.innerHTML = iconSvg('<path d="M9 18l6-6-6-6"/>', 2);

    var name = document.createElement('h3');
    name.className = 't-name';
    name.textContent = t.name;

    var desc = document.createElement('p');
    desc.className = 't-desc';
    desc.textContent = t.desc;

    var file = document.createElement('span');
    file.className = 't-file';
    file.textContent = t.file;

    a.appendChild(icon);
    a.appendChild(arrow);
    a.appendChild(name);
    a.appendChild(desc);
    a.appendChild(file);
    return a;
  }

  /* 入场动画：逐张淡入上移；结束后清掉 delay，避免影响悬停过渡 */
  function reveal(a, i) {
    if (reduceMotion) { a.classList.add('in'); return; }
    a.style.transitionDelay = (i * 55) + 'ms';
    requestAnimationFrame(function () {
      requestAnimationFrame(function () { a.classList.add('in'); });
    });
    a.addEventListener('transitionend', function onEnd(e) {
      if (e.propertyName === 'transform') {
        a.style.transitionDelay = '';
        a.removeEventListener('transitionend', onEnd);
      }
    });
  }

  function showEmpty(kind, q) {
    if (kind === 'reg') {
      emptyTitle.textContent = '还没有工具';
      emptyDesc.textContent = '在 tools.js 里注册一条，就会出现在这里。';
      emptyReset.hidden = true;
    } else {
      emptyTitle.textContent = '没有找到匹配的工具';
      emptyDesc.textContent = '没有包含「' + q + '」的工具，换个关键词试试。';
      emptyReset.hidden = false;
    }
    emptyEl.hidden = false;
  }

  function hideEmpty() { emptyEl.hidden = true; }

  function updateHint() {
    var hide = !!searchInput.value || document.activeElement === searchInput;
    searchHint.style.opacity = hide ? '0' : '';
  }

  function applyFilter() {
    var q = searchInput.value.trim().toLowerCase();
    var shown = 0;
    cards.forEach(function (c) {
      var hay = (c.data.name + ' ' + (c.data.desc || '') + ' ' + c.data.file).toLowerCase();
      var match = !q || hay.indexOf(q) !== -1;
      c.el.style.display = match ? '' : 'none';
      if (match) shown++;
    });
    countEl.textContent = shown;
    searchClear.classList.toggle('show', !!searchInput.value);
    updateHint();
    if (list.length && shown === 0) showEmpty('search', searchInput.value.trim());
    else hideEmpty();
  }

  countEl.textContent = list.length;

  if (!list.length) {
    showEmpty('reg');
  } else {
    list.forEach(function (t, i) {
      var a = buildCard(t);
      grid.appendChild(a);
      cards.push({ data: t, el: a });
      reveal(a, i);
    });
  }

  function clearSearch() {
    searchInput.value = '';
    applyFilter();
    searchInput.focus();
  }

  searchInput.addEventListener('input', applyFilter);
  searchInput.addEventListener('focus', updateHint);
  searchInput.addEventListener('blur', updateHint);
  searchInput.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      searchInput.value = '';
      applyFilter();
      searchInput.blur();
    }
  });
  searchClear.addEventListener('click', clearSearch);
  emptyReset.addEventListener('click', clearSearch);

  /* 按 "/" 快速聚焦搜索框 */
  document.addEventListener('keydown', function (e) {
    if (e.key !== '/' || e.metaKey || e.ctrlKey || e.altKey) return;
    var ae = document.activeElement;
    if (ae === searchInput || (ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName))) return;
    e.preventDefault();
    searchInput.focus();
  });

  /* ---------- 深浅色切换 ---------- */
  function currentTheme() {
    return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  }
  function syncMetaTheme(t) {
    if (metaTheme) metaTheme.setAttribute('content', t === 'dark' ? '#000000' : '#f5f5f7');
  }
  syncMetaTheme(currentTheme());
  themeBtn.addEventListener('click', function () {
    var next = currentTheme() === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('htools:theme', next); } catch (e) {}
    syncMetaTheme(next);
  });
})();
</script>
