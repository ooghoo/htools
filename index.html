<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>htools · HTML 小工具合集</title>
<meta name="description" content="纯前端、零依赖、离线可用的单文件 HTML 小工具合集。">
<meta name="theme-color" content="#fbfbfc" id="meta-theme">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230071e3'/><path d='M13 12l-2.5 4L13 20M19 12l2.5 4L19 20' stroke='white' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<script>
  /* 预置：.js 类（无 JS 时内容直接可见）+ 主题（默认跟随系统，防刷新闪屏） */
  (function () {
    var de = document.documentElement;
    de.classList.add('js');
    try {
      var t = localStorage.getItem('htools:theme');
      if (t !== 'light' && t !== 'dark') {
        t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      de.setAttribute('data-theme', t);
      var m = document.getElementById('meta-theme');
      if (m) m.setAttribute('content', t === 'dark' ? '#0a0a0a' : '#fbfbfc');
    } catch (e) {}
  })();
</script>
<style>
  /* ============================================================
     设计 token：取自 CloudAI 设计体系 aidbs 主题（Light / Dark 实际取值）
     本工程为零构建单文件页面，按降级模式把语义 token 映射为 CSS 变量。
     ============================================================ */
  :root {
    color-scheme: light;

    --background: hsl(0 0% 98.82%);
    --background-95: hsl(0 0% 98.82% / .95);
    --card: hsl(0 0% 100%);
    --card-foreground: hsl(240 4.76% 4.12%);
    --foreground: hsl(240 4.76% 4.12%);
    --muted: hsl(240 9.09% 95.69%);
    --muted-foreground: hsl(240 1.1% 64.31%);
    --secondary: hsl(240 9.09% 95.69%);
    --secondary-foreground: hsl(240 4.76% 4.12%);
    --accent: hsl(240 9.09% 95.69%);
    --accent-foreground: hsl(240 4.55% 8.63%);
    --border: hsl(220 5.66% 89.61%);
    --input: hsl(220 5.66% 89.61%);
    --ring: hsl(240 1.1% 64.31%);
    --primary: hsl(0 0% 9.02%);
    --primary-foreground: hsl(0 0% 98.04%);
    --popover: hsl(0 0% 100%);
    --popover-foreground: hsl(240 4.76% 4.12%);

    /* Brand 色阶（仅作品牌识别与强调，不替代 Primary） */
    --brand: hsl(235.65 84.93% 71.37%);
    --brand-1: hsl(240 100% 98.43%);
    --brand-2: hsl(236.25 94.12% 93.33%);
    --brand-6: hsl(235.65 84.93% 71.37%);
    --brand-foreground: hsl(236.82 73.33% 64.71%);

    --sidebar-foreground: hsl(240 13.95% 16.86%);
    --sidebar-accent: hsl(240 18.18% 95.69%);
    --sidebar-accent-foreground: hsl(240 13.95% 16.86%);
    --sidebar-border: hsl(240 20.75% 89.61%);

    /* 圆角：shadcn 刻度 --radius 0.5rem，卡片 12、面板 20、小件 6/4 */
    --radius: 8px;
    --radius-card: 12px;
    --radius-panel: 20px;

    --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang SC", "Helvetica Neue", "Segoe UI", sans-serif;
    --mono: "SF Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  html[data-theme="dark"] {
    color-scheme: dark;

    --background: hsl(0 0% 3.92%);
    --background-95: hsl(0 0% 3.92% / .95);
    --card: hsl(0 0% 9.02%);
    --card-foreground: hsl(0 0% 98.04%);
    --foreground: hsl(0 0% 98.04%);
    --muted: hsl(0 0% 14.9%);
    --muted-foreground: hsl(240 0.83% 52.55%);
    --secondary: hsl(0 0% 14.9%);
    --secondary-foreground: hsl(0 0% 98.04%);
    --accent: hsl(0 0% 25.1%);
    --accent-foreground: hsl(0 0% 98.04%);
    --border: hsl(0 0% 14.9%);
    --input: hsl(0 0% 14.9%);
    --ring: hsl(0 0% 45.1%);
    --primary: hsl(0 0% 89.8%);
    --primary-foreground: hsl(0 0% 9.02%);
    --popover: hsl(0 0% 14.9%);
    --popover-foreground: hsl(0 0% 98.04%);

    --brand: hsl(234.88 93.18% 82.75%);
    --brand-1: hsl(237.45 47.47% 19.41%);
    --brand-2: hsl(236.57 48.61% 28.24%);
    --brand-6: hsl(234.88 93.18% 82.75%);
    --brand-foreground: hsl(235.79 93.44% 88.04%);

    --sidebar-foreground: hsl(264 100% 99.02%);
    --sidebar-accent: hsl(0 0% 14.9%);
    --sidebar-accent-foreground: hsl(0 0% 98.04%);
    --sidebar-border: hsl(0 0% 13.73%);
  }

  /* ================= 基础 ================= */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: var(--font);
    font-size: 14px;
    line-height: 1.5;
    background: var(--background);
    color: var(--foreground);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    -webkit-tap-highlight-color: transparent;
  }
  button { touch-action: manipulation; font-family: inherit; }
  a { color: inherit; }
  ::selection { background: hsl(235.65 84.93% 71.37% / .28); }

  /* ============================================================
     AppShell：整页不滚，滚动只发生在 ContentArea 内部
     ============================================================ */
  .shell {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: linear-gradient(to bottom, var(--card) 0%, var(--brand-1) 52%, var(--brand-2) 100%);
  }

  /* ---------- TopBar：高 56，常驻不滚 ---------- */
  .topbar {
    flex-shrink: 0;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 0 max(24px, env(safe-area-inset-right)) 0 max(24px, env(safe-area-inset-left));
  }
  .topbar-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .topbar-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

  .tbtn {
    width: 32px;
    height: 32px;
    border: none;
    border-radius: 6px;
    background: transparent;
    color: var(--foreground);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    text-decoration: none;
    flex-shrink: 0;
    transition: background-color .15s, color .15s, transform .1s;
  }
  .tbtn:hover { background: var(--accent); }
  .tbtn:active { transform: scale(.92); }
  .tbtn:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--ring); }
  .tbtn svg { width: 16px; height: 16px; }

  /* 产品标识：28×28 深底白字 mark + 产品名 */
  .brand { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--foreground); }
  .brand-mark {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    background: var(--foreground);
    color: var(--background);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .brand-mark svg { width: 14px; height: 14px; }
  .brand-name { font-size: 14px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; }

  .tbar-sep { width: 1px; height: 20px; background: var(--border); flex-shrink: 0; }
  .tbar-label { font-size: 13px; color: var(--muted-foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* 深浅色切换：日月图标交叉淡入淡出 */
  .theme-btn { position: relative; }
  .theme-btn .i {
    position: absolute;
    display: inline-flex;
    transition: opacity .25s, transform .3s;
  }
  .theme-btn .i-moon { opacity: 1; transform: none; }
  .theme-btn .i-sun { opacity: 0; transform: rotate(-90deg) scale(.5); }
  html[data-theme="dark"] .theme-btn .i-moon { opacity: 0; transform: rotate(90deg) scale(.5); }
  html[data-theme="dark"] .theme-btn .i-sun { opacity: 1; transform: none; }

  /* ---------- 主体行：左右下外距 12、间隙 8，无上外距 ---------- */
  .main-row {
    flex: 1;
    min-height: 0;
    display: flex;
    gap: 8px;
    padding: 0 max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
  }

  /* ---------- Sidebar：展开 248，收起整块移出布局（不是图标栏） ---------- */
  .sidebar {
    display: none;
    width: 248px;
    flex-shrink: 0;
    flex-direction: column;
    gap: 16px;
    padding: 20px 8px 12px;
  }
  .shell[data-sidebar="open"] .sidebar { display: flex; }
  .sidebar-nav {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .side-group { display: flex; flex-direction: column; gap: 2px; }
  .side-label {
    font-size: 12px;
    color: var(--muted-foreground);
    padding: 4px 8px;
  }
  .side-item {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 32px;
    padding: 0 8px;
    border-radius: 6px;
    font-size: 14px;
    color: var(--sidebar-foreground);
    text-decoration: none;
    white-space: nowrap;
    transition: background-color .15s, color .15s;
  }
  .side-item svg { width: 16px; height: 16px; flex-shrink: 0; color: var(--secondary-foreground); }
  .side-item:hover { background: var(--sidebar-accent); }
  .side-item.is-active { background: var(--brand-1); color: var(--sidebar-accent-foreground); font-weight: 500; }
  .side-item .ext { width: 12px; height: 12px; margin-left: auto; opacity: .55; flex-shrink: 0; }
  .side-foot {
    flex-shrink: 0;
    font-size: 11.5px;
    line-height: 1.6;
    color: var(--muted-foreground);
    padding: 0 8px;
  }

  /* ---------- ContentArea：唯一主滚动容器 ---------- */
  .content {
    position: relative;
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    border: 1px solid var(--brand-2);
    border-radius: var(--radius-panel);
    background: var(--background-95);
    box-shadow: 0 10px 15px -3px rgb(0 0 0 / .1), 0 4px 6px -4px rgb(0 0 0 / .1);
    overflow: hidden;
  }
  .content-scroll {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
  }
  .content-mask {
    position: absolute;
    inset: auto 0 0 0;
    height: 88px;
    background: linear-gradient(to bottom, transparent, var(--background));
    pointer-events: none;
  }

  /* ============================================================
     PageContent：ResourceList 内容子树
     ============================================================ */
  .page {
    display: flex;
    flex-direction: column;
    gap: 48px;
    padding: 16px clamp(16px, 3vw, 36px) 36px;
  }

  /* ---------- 概览组 ---------- */
  .overview { display: flex; flex-direction: column; gap: 24px; }
  .page-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  .page-head h1 {
    font-size: 24px;
    font-weight: 500;
    letter-spacing: -0.02em;
    line-height: 32px;
  }
  .page-sub { margin-top: 4px; font-size: 13px; color: var(--muted-foreground); }

  .btn-ghost {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 32px;
    padding: 0 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--card);
    color: var(--foreground);
    font-size: 13px;
    font-weight: 500;
    text-decoration: none;
    white-space: nowrap;
    flex-shrink: 0;
    transition: background-color .15s, color .15s, transform .1s;
  }
  .btn-ghost:hover { background: var(--accent); }
  .btn-ghost:active { transform: scale(.97); }
  .btn-ghost:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--ring); }
  .btn-ghost svg { width: 14px; height: 14px; flex-shrink: 0; }

  .btn-primary {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    height: 32px;
    padding: 0 12px;
    border: none;
    border-radius: 6px;
    background: var(--primary);
    color: var(--primary-foreground);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: background-color .15s, color .15s, transform .1s;
  }
  .btn-primary:hover { opacity: .88; }
  .btn-primary:active { transform: scale(.97); }
  .btn-primary:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--ring); }

  /* MetricCards：只读指标，2～4 张等宽，间距 12 */
  .metrics { display: flex; flex-wrap: wrap; gap: 12px; }
  .metric {
    flex: 1;
    min-width: 200px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-card);
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .metric-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    align-self: flex-start;
    background: var(--brand-1);
    color: var(--brand-6);
    font-size: 12px;
    font-weight: 500;
    border-radius: 6px;
    padding: 2px 8px;
  }
  .metric-badge svg { width: 12px; height: 12px; flex-shrink: 0; }
  .metric-value {
    font-size: 24px;
    font-weight: 600;
    letter-spacing: -0.02em;
    line-height: 1.2;
    font-variant-numeric: tabular-nums;
  }
  .metric-desc { font-size: 12px; color: var(--muted-foreground); }

  /* ---------- 列表区 ---------- */
  .list-region { display: flex; flex-direction: column; gap: 12px; min-width: 0; }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
  }
  .toolbar-right { display: flex; align-items: center; gap: 8px; margin-left: auto; }

  /* 搜索框：高 32 */
  .search { position: relative; width: 224px; max-width: 100%; }
  .search .s-icon {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    width: 14px;
    height: 14px;
    color: var(--muted-foreground);
    pointer-events: none;
  }
  .search input {
    width: 100%;
    height: 32px;
    border: 1px solid var(--input);
    border-radius: 6px;
    background: var(--background);
    color: var(--foreground);
    font-size: 13px;
    font-family: inherit;
    padding: 0 56px 0 30px;
    outline: none;
    -webkit-appearance: none;
    appearance: none;
  }
  .search input::placeholder { color: var(--muted-foreground); }
  .search input:focus { border-color: var(--ring); box-shadow: 0 0 0 2px var(--ring); }
  .s-hint {
    position: absolute;
    right: 34px;
    top: 50%;
    transform: translateY(-50%);
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted-foreground);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 0 5px;
    line-height: 16px;
    pointer-events: none;
    transition: opacity .15s;
  }
  .s-clear {
    position: absolute;
    right: 4px;
    top: 50%;
    transform: translateY(-50%);
    width: 24px;
    height: 24px;
    border: none;
    border-radius: 999px;
    background: var(--muted);
    color: var(--muted-foreground);
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    transition: background-color .15s, color .15s;
  }
  .s-clear.show { display: inline-flex; }
  .s-clear:hover { color: var(--foreground); }
  .s-clear:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--ring); }
  .s-clear svg { width: 11px; height: 11px; }
  @media (hover: none) { .s-hint { display: none; } }

  .hit {
    font-size: 12px;
    color: var(--muted-foreground);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  /* ViewSwitch：卡片 / 列表两档 */
  .viewswitch {
    display: inline-flex;
    gap: 2px;
    padding: 2px;
    background: var(--muted);
    border-radius: 6px;
    flex-shrink: 0;
  }
  .vs-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    height: 28px;
    padding: 0 8px;
    border: none;
    border-radius: 4px;
    background: transparent;
    color: var(--muted-foreground);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: background-color .15s, color .15s, transform .1s;
  }
  .vs-btn svg { width: 13px; height: 13px; flex-shrink: 0; }
  .vs-btn:hover { color: var(--foreground); }
  .vs-btn:active { transform: scale(.96); }
  .vs-btn:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--ring); }
  .vs-btn.is-active {
    background: var(--card);
    color: var(--foreground);
    box-shadow: 0 1px 2px rgb(0 0 0 / .08);
  }

  /* ---------- 卡片网格：1 / sm:2 / lg:3 / xl:4 ---------- */
  .grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 16px;
  }
  @media (min-width: 640px)  { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (min-width: 1024px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  @media (min-width: 1280px) { .grid { grid-template-columns: repeat(4, 1fr); } }

  /* ResourceCard：内边距 16、块间 12、圆角 12，hover 描边转品牌色 */
  .rcard {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 16px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-card);
    text-decoration: none;
    color: var(--card-foreground);
  }
  @media (hover: hover) and (pointer: fine) {
    .rcard:hover { border-color: var(--brand); }
  }
  .rcard:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--ring); }
  .rcard-head { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .rcard-icon {
    width: 32px;
    height: 32px;
    border-radius: 6px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    flex-shrink: 0;
    background-image: linear-gradient(150deg, rgba(255, 255, 255, .26), rgba(255, 255, 255, 0) 62%);
  }
  .rcard-icon svg { width: 16px; height: 16px; }
  .rcard-title { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rcard-desc {
    font-size: 13px;
    line-height: 1.5;
    color: var(--muted-foreground);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .rcard-spacer { flex: 1; min-height: 24px; }
  .rcard-foot {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11.5px;
    color: var(--muted-foreground);
  }
  .rcard-file {
    font-family: var(--mono);
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* ---------- 表格视图：表头 36、行高 52、外框圆角 8 ---------- */
  .tbl {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .tbl-head, .tbl-row {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 0 16px;
  }
  .tbl-head {
    height: 36px;
    background: var(--muted);
    font-size: 12px;
    color: var(--muted-foreground);
  }
  .tbl-row {
    height: 52px;
    border-top: 1px solid var(--border);
    text-decoration: none;
    color: var(--foreground);
    transition: background-color .15s;
  }
  .tbl-row:last-child { border-bottom: none; }
  .tbl-row:hover { background: var(--muted); }
  .tbl-row:focus-visible { outline: none; box-shadow: inset 0 0 0 2px var(--ring); }
  .c-tool { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; }
  .c-tool .rcard-icon { width: 28px; height: 28px; border-radius: 6px; }
  .c-tool .rcard-icon svg { width: 14px; height: 14px; }
  .c-name { font-size: 13.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .c-desc { flex: 1.6; min-width: 0; font-size: 12.5px; color: var(--muted-foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .c-file { flex: 1; min-width: 0; font-family: var(--mono); font-size: 11.5px; color: var(--muted-foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .c-act { width: 16px; flex-shrink: 0; color: var(--muted-foreground); }
  .c-act svg { width: 14px; height: 14px; }
  @media (max-width: 767px) { .c-file { display: none; } }

  /* ---------- 空状态（发生在列表区内部） ---------- */
  .list-empty {
    border: 1px dashed var(--border);
    border-radius: var(--radius-card);
    padding: 48px 24px;
    text-align: center;
  }
  .list-empty .le-icon { width: 36px; height: 36px; margin: 0 auto 12px; color: var(--muted-foreground); }

<script>
(function () {
  'use strict';

  /* ---------- 工具图标库（新增工具时在这里补图标） ---------- */
  var ICONS = {
    byte: '<ellipse cx="12" cy="5.5" rx="7.5" ry="3"/><path d="M4.5 5.5v6c0 1.66 3.36 3 7.5 3s7.5-1.34 7.5-3v-6"/><path d="M4.5 11.5c0 1.66 3.36 3 7.5 3s7.5-1.34 7.5-3"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    code: '<path d="M9 8l-4 4 4 4M15 8l4 4-4 4"/>',
    text: '<path d="M4 6.5V5h16v1.5M12 5v14M8.5 19h7"/>',
    time: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3.5 2"/>',
    color: '<path d="M12 3.5c4.7 0 8.5 3.4 8.5 7.6 0 2.6-2 4.4-4.4 4.4h-2.3c-1 0-1.6.7-1.6 1.6 0 .5.2.9.2 1.4 0 .9-.7 1.5-1.5 1.5-4.4 0-7.9-3.7-7.9-8.2C3 6.9 6.9 3.5 12 3.5z"/><circle cx="8" cy="9.5" r="1.3" fill="currentColor" stroke="none"/><circle cx="12" cy="7.5" r="1.3" fill="currentColor" stroke="none"/><circle cx="16" cy="9.5" r="1.3" fill="currentColor" stroke="none"/>',
    image: '<rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="M3.5 16.5l4.5-4.5 4 3.5 3.5-3 5 4.5"/>'
  };

  var shell = document.getElementById('shell');
  var grid = document.getElementById('grid');
  var tbl = document.getElementById('tbl');
  var tblHead = tbl.querySelector('.tbl-head');
  var emptyEl = document.getElementById('empty');
  var emptyTitle = document.getElementById('empty-title');
  var emptyDesc = document.getElementById('empty-desc');
  var emptyReset = document.getElementById('empty-reset');
  var searchInput = document.getElementById('search-input');
  var searchClear = document.getElementById('search-clear');
  var searchHint = document.getElementById('search-hint');
  var hitEl = document.getElementById('hit');
  var mCount = document.getElementById('m-count');
  var metaTheme = document.getElementById('meta-theme');
  var themeBtn = document.getElementById('theme-toggle');
  var sidebarToggle = document.getElementById('sidebar-toggle');
  var sidebarBackdrop = document.getElementById('sidebar-backdrop');

  var list = (typeof TOOLS !== 'undefined' && Array.isArray(TOOLS)) ? TOOLS : [];
  var entries = []; /* { data, card, row } */
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function iconSvg(inner, w) {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="' + (w || 1.6) + '" stroke-linecap="round" stroke-linejoin="round">' + inner + '</svg>';
  }
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  /* ---------- 构建卡片与行（两种视图共用同一份数据） ---------- */
  function buildEntry(t) {
    var accent = t.accent || '#0071e3';
    var iconInner = ICONS[t.icon] || ICONS.plus;

    var card = document.createElement('a');
    card.className = 'rcard';
    card.href = t.file;
    card.innerHTML =
      '<span class="rcard-head">' +
        '<span class="rcard-icon" style="background-color:' + accent + '" aria-hidden="true">' + iconSvg(iconInner) + '</span>' +
        '<span class="rcard-title">' + esc(t.name) + '</span>' +
      '</span>' +
      '<span class="rcard-desc">' + esc(t.desc) + '</span>' +
      '<span class="rcard-spacer" aria-hidden="true"></span>' +
      '<span class="rcard-foot"><span class="rcard-file">' + esc(t.file) + '</span></span>';

    var row = document.createElement('a');
    row.className = 'tbl-row';
    row.href = t.file;
    row.innerHTML =
      '<span class="c-tool">' +
        '<span class="rcard-icon" style="background-color:' + accent + '" aria-hidden="true">' + iconSvg(iconInner) + '</span>' +
        '<span class="c-name">' + esc(t.name) + '</span>' +
      '</span>' +
      '<span class="c-desc">' + esc(t.desc) + '</span>' +
      '<span class="c-file">' + esc(t.file) + '</span>' +
      '<span class="c-act" aria-hidden="true">' + iconSvg('<path d="m9 18 6-6-6-6"/>', 2.2) + '</span>';

    return { data: t, card: card, row: row };
  }

  /* ---------- 视图切换：只改呈现，不清空搜索 ---------- */
  var viewBtns = Array.prototype.slice.call(document.querySelectorAll('.vs-btn'));
  function setView(v, persist) {
    viewBtns.forEach(function (b) {
      var on = b.dataset.view === v;
      b.classList.toggle('is-active', on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    grid.hidden = v !== 'card';
    tbl.hidden = v !== 'table';
    if (persist) {
      try { localStorage.setItem('htools:view', v); } catch (e) {}
    }
  }
  viewBtns.forEach(function (b) {
    b.addEventListener('click', function () { setView(b.dataset.view, true); });
  });

  /* ---------- 渲染 + 过滤 ---------- */
  function updateHit(shown, total, filtering) {
    hitEl.hidden = !filtering;
    hitEl.textContent = filtering ? (shown + ' / ' + total) : '';
  }

  function showEmpty(kind, q) {
    if (kind === 'reg') {
      emptyTitle.textContent = '暂无数据';
      emptyDesc.textContent = '在 tools.js 里注册一条，就会出现在这里。';
      emptyReset.hidden = true;
    } else {
      emptyTitle.textContent = '未找到匹配项';
      emptyDesc.textContent = '没有包含「' + q + '」的工具，换个关键词试试。';
      emptyReset.hidden = false;
    }
    emptyEl.hidden = false;
  }

  function hideEmpty() { emptyEl.hidden = true; }

  function updateHint() {
    var hide = !!searchInput.value || document.activeElement === searchInput;
    searchHint.style.opacity = hide ? '0' : '';
  }

  function applyFilter() {
    var q = searchInput.value.trim().toLowerCase();
    var shown = 0;
    entries.forEach(function (en) {
      var hay = (en.data.name + ' ' + (en.data.desc || '') + ' ' + en.data.file).toLowerCase();
      var match = !q || hay.indexOf(q) !== -1;
      en.card.style.display = match ? '' : 'none';
      en.row.style.display = match ? '' : 'none';
      if (match) shown++;
    });
    updateHit(shown, list.length, !!q);
    searchClear.classList.toggle('show', !!searchInput.value);
    updateHint();
    if (list.length && shown === 0) showEmpty('search', searchInput.value.trim());
    else hideEmpty();
  }

  mCount.textContent = list.length;

  if (!list.length) {
    showEmpty('reg');
    updateHit(0, 0, false);
  } else {
    list.forEach(function (t) {
      var en = buildEntry(t);
      grid.appendChild(en.card);
      tbl.appendChild(en.row);
      entries.push(en);
    });
    updateHit(list.length, list.length, false);
  }

  /* ---------- 搜索交互 ---------- */
  function clearSearch() {
    searchInput.value = '';
    applyFilter();
    searchInput.focus();
  }
  searchInput.addEventListener('input', applyFilter);
  searchInput.addEventListener('focus', updateHint);
  searchInput.addEventListener('blur', updateHint);
  searchInput.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      searchInput.value = '';
      applyFilter();
      searchInput.blur();
    }
  });
  searchClear.addEventListener('click', clearSearch);
  emptyReset.addEventListener('click', clearSearch);

  /* 按 "/" 快速聚焦搜索框 */
  document.addEventListener('keydown', function (e) {
    if (e.key !== '/' || e.metaKey || e.ctrlKey || e.altKey) return;
    var ae = document.activeElement;
    if (ae === searchInput || (ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName))) return;
    e.preventDefault();
    searchInput.focus();
  });

  /* ---------- 侧栏：跟随 1440 自动开合，手动一次后交给用户 ---------- */
  var mqWide = window.matchMedia('(min-width: 90rem)');
  var userTookOver = false;

  function setSidebar(open) {
    shell.setAttribute('data-sidebar', open ? 'open' : 'closed');
    sidebarToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    sidebarToggle.setAttribute('aria-label', open ? '收起侧栏' : '展开侧栏');
  }
  function syncSidebar() {
    if (!userTookOver) setSidebar(mqWide.matches);
  }
  sidebarToggle.addEventListener('click', function () {
    userTookOver = true;
    setSidebar(shell.getAttribute('data-sidebar') !== 'open');
  });
  sidebarBackdrop.addEventListener('click', function () {
    userTookOver = true;
    setSidebar(false);
  });
  if (typeof mqWide.addEventListener === 'function') {
    mqWide.addEventListener('change', syncSidebar);
  }
  syncSidebar();

  /* ---------- 深浅色：默认跟随系统，手动选择后记住并停止跟随 ---------- */
  var mqDark = window.matchMedia('(prefers-color-scheme: dark)');
  function storedTheme() {
    try { return localStorage.getItem('htools:theme'); } catch (e) { return null; }
  }
  function currentTheme() {
    return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  }
  function applyTheme(t, persist) {
    document.documentElement.setAttribute('data-theme', t);
    if (metaTheme) metaTheme.setAttribute('content', t === 'dark' ? '#0a0a0a' : '#fbfbfc');
    if (persist) {
      try { localStorage.setItem('htools:theme', t); } catch (e) {}
    }
  }
  applyTheme(currentTheme(), false);
  themeBtn.addEventListener('click', function () {
    applyTheme(currentTheme() === 'dark' ? 'light' : 'dark', true);
  });
  if (typeof mqDark.addEventListener === 'function') {
    mqDark.addEventListener('change', function (e) {
      if (!storedTheme()) applyTheme(e.matches ? 'dark' : 'light', false);
    });
  }

  /* ---------- 初始视图（本地记住，默认卡片） ---------- */
  var savedView = 'card';
  try { savedView = localStorage.getItem('htools:view') || 'card'; } catch (e) {}
  setView(savedView === 'table' ? 'table' : 'card', false);
})();
</script>
</body>
</html>
