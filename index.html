<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>htools · HTML 小工具合集</title>
<meta name="description" content="纯前端、零依赖、离线可用的单文件 HTML 小工具合集。">
<meta name="theme-color" content="#f6f6f8" id="meta-theme">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230071e3'/><path d='M13 12l-2.5 4L13 20M19 12l2.5 4L19 20' stroke='white' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<script>
  /* 预置：.js 类（无 JS 时内容直接可见）+ 主题（默认跟随系统，防刷新闪屏） */
  (function () {
    var de = document.documentElement;
    de.classList.add('js');
    try {
      var t = localStorage.getItem('htools:theme');
      if (t !== 'light' && t !== 'dark') {
        t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      de.setAttribute('data-theme', t);
      var m = document.getElementById('meta-theme');
      if (m) m.setAttribute('content', t === 'dark' ? '#000000' : '#f6f6f8');
    } catch (e) {}
  })();
</script>
<style>
  /* ================= 设计变量 ================= */
  :root {
    color-scheme: light;

    --bg: #f6f6f8;
    --card: #ffffff;
    --text: #18181b;
    --text-2: #52525b;
    --text-3: #8e8e96;
    --line: #e3e3e8;
    --line-2: #ebebef;
    --topbar-bg: rgba(246, 246, 248, .84);
    --field: #ececef;
    --field-focus: #ffffff;
    --chip: rgba(0, 0, 0, .045);
    --accent: #0071e3;
    --hover-border: rgba(0, 113, 227, .38);
    --focus-ring: rgba(0, 113, 227, .3);

    --shadow: 0 1px 2px rgba(16, 16, 20, .04), 0 4px 12px rgba(16, 16, 20, .04);
    --shadow-hover: 0 2px 6px rgba(16, 16, 20, .07), 0 10px 24px rgba(16, 16, 20, .09);

    --radius: 12px;
    --radius-sm: 9px;

    --ease: cubic-bezier(.25, .8, .25, 1);
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang SC", "Helvetica Neue", "Segoe UI", sans-serif;
    --mono: "SF Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  html[data-theme="dark"] {
    color-scheme: dark;

    --bg: #0c0c0e;
    --card: #161619;
    --text: #f4f4f5;
    --text-2: #a1a1aa;
    --text-3: #71717a;
    --line: #26262b;
    --line-2: #202024;
    --topbar-bg: rgba(12, 12, 14, .84);
    --field: #1c1c20;
    --field-focus: #1c1c20;
    --chip: rgba(255, 255, 255, .06);
    --accent: #3b9bff;
    --hover-border: rgba(59, 155, 255, .45);
    --focus-ring: rgba(59, 155, 255, .35);

    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 12px rgba(0, 0, 0, .22);
    --shadow-hover: 0 2px 6px rgba(0, 0, 0, .35), 0 10px 24px rgba(0, 0, 0, .3);
  }

  /* ================= 基础 ================= */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  body {
    font-family: var(--font);
    font-size: 14px;
    line-height: 1.5;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    -webkit-tap-highlight-color: transparent;
    transition: background-color .3s var(--ease), color .3s var(--ease);
  }
  button { touch-action: manipulation; font-family: inherit; }
  ::selection { background: rgba(0, 113, 227, .18); }
  html[data-theme="dark"] ::selection { background: rgba(59, 155, 255, .28); }

  /* ================= 顶栏（sticky 磨砂） ================= */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--topbar-bg);
    -webkit-backdrop-filter: saturate(180%) blur(16px);
    backdrop-filter: saturate(180%) blur(16px);
    border-bottom: 1px solid var(--line);
  }
  .topbar-inner {
    max-width: 1120px;
    margin: 0 auto;
    min-height: 56px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    padding: 0 max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left));
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 9px;
    text-decoration: none;
    color: var(--text);
    flex-shrink: 0;
  }
  .brand-logo {
    width: 26px;
    height: 26px;
    border-radius: 8px;
    background: linear-gradient(150deg, #5aa9ff, #0071e3);
    box-shadow: 0 2px 6px rgba(0, 113, 227, .26), inset 0 1px 0 rgba(255, 255, 255, .32);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    flex-shrink: 0;
  }
  .brand-logo svg { width: 14px; height: 14px; }
  .brand-name {
    font-family: var(--mono);
    font-size: 14.5px;
    font-weight: 600;
    letter-spacing: -0.2px;
  }
  .brand-sep { width: 1px; height: 15px; background: var(--line); flex-shrink: 0; }
  .brand-sub { font-size: 12.5px; color: var(--text-3); white-space: nowrap; }
  @media (max-width: 400px) { .brand-sep, .brand-sub { display: none; } }

  .topbar-actions { display: flex; align-items: center; gap: 2px; margin-left: auto; flex-shrink: 0; }
  .icon-btn {
    position: relative;
    width: 34px;
    height: 34px;
    border: none;
    border-radius: var(--radius-sm);
    background: transparent;
    color: var(--text-2);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    text-decoration: none;
    transition: color .2s var(--ease), background-color .2s var(--ease), transform .15s var(--ease);
  }
  .icon-btn:hover { color: var(--text); background: var(--chip); }
  .icon-btn:active { transform: scale(.9); }
  .icon-btn:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--focus-ring); }
  .icon-btn svg { width: 16px; height: 16px; }

  /* 深浅色切换：日月图标交叉淡入淡出 */
  .theme-btn .i {
    position: absolute;
    display: flex;
    transition: opacity .25s var(--ease), transform .3s var(--ease);
  }
  .theme-btn .i-moon { opacity: 1; transform: none; }
  .theme-btn .i-sun { opacity: 0; transform: rotate(-90deg) scale(.5); }
  html[data-theme="dark"] .theme-btn .i-moon { opacity: 0; transform: rotate(90deg) scale(.5); }
  html[data-theme="dark"] .theme-btn .i-sun { opacity: 1; transform: none; }

  /* ---------- 顶栏搜索 ---------- */
  .topbar-search { position: relative; flex: 0 1 400px; min-width: 0; margin-left: auto; }
  .topbar-search .s-icon {
    position: absolute;
    left: 11px;
    top: 50%;
    transform: translateY(-50%);
    width: 15px;
    height: 15px;
    color: var(--text-3);
    pointer-events: none;
    transition: color .2s var(--ease);
  }
  .topbar-search:focus-within .s-icon { color: var(--accent); }
  .topbar-search input {
    width: 100%;
    height: 36px;
    border: 1px solid transparent;
    border-radius: var(--radius-sm);
    background: var(--field);
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    padding: 0 62px 0 34px;
    outline: none;
    -webkit-appearance: none;
    appearance: none;
    transition: background-color .2s var(--ease), border-color .2s var(--ease), box-shadow .2s var(--ease);
  }
  .topbar-search input::placeholder { color: var(--text-3); }
  .topbar-search input:focus {
    background: var(--field-focus);
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--focus-ring);
  }
  .s-hint {
    position: absolute;
    right: 40px;
    top: 50%;
    transform: translateY(-50%);
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-3);
    background: var(--chip);
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 1px 6px;
    pointer-events: none;
    transition: opacity .2s var(--ease);
  }
  .s-clear {
    position: absolute;
    right: 5px;
    top: 50%;
    transform: translateY(-50%);
    width: 27px;
    height: 27px;
    border: none;
    border-radius: 999px;
    background: var(--chip);
    color: var(--text-2);
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    transition: background-color .2s var(--ease), color .2s var(--ease), transform .15s var(--ease);
  }
  .s-clear.show { display: flex; }
  .s-clear:hover { color: var(--text); }
  .s-clear:active { transform: translateY(-50%) scale(.86); }
  .s-clear:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--focus-ring); }
  .s-clear svg { width: 11px; height: 11px; }
  @media (hover: none) { .s-hint { display: none; } }

  /* 窄屏：顶栏两行（品牌+操作 / 搜索通栏） */
  @media (max-width: 560px) {
    .topbar-inner { padding-top: 7px; }
    .topbar-search {
      order: 3;
      flex: 1 0 100%;
      max-width: none;
      margin: 0 0 9px;
    }
    .topbar-search input { font-size: 16px; /* ≥16px，避免 iOS 聚焦自动放大 */ }
  }

  /* ================= 页面头 ================= */
  .wrap {
    max-width: 1120px;
    margin: 0 auto;
    padding: clamp(24px, 4vw, 40px) max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left));
  }
  .page-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: clamp(18px, 2.6vw, 26px);
  }
  .page-head h1 { font-size: clamp(20px, 2.4vw, 24px); font-weight: 700; letter-spacing: -0.3px; }
  .page-sub { margin-top: 6px; font-size: 13px; line-height: 1.6; color: var(--text-2); }
  .count-pill {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-2);
    background: var(--chip);
    border-radius: 999px;
    padding: 4px 11px;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  /* ================= 工具网格：列数只由视口宽度决定 ================= */
  .grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
  }
  @media (min-width: 520px)  { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (min-width: 760px)  { .grid { grid-template-columns: repeat(3, 1fr); } }
  @media (min-width: 1080px) { .grid { grid-template-columns: repeat(4, 1fr); } }

  /* ================= 工具卡片（紧凑横排） ================= */
  .tool {
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 84px;
    padding: 14px 14px 14px 15px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    text-decoration: none;
    color: inherit;
    transition:
      transform .25s var(--ease),
      box-shadow .25s var(--ease),
      border-color .25s var(--ease),
      background-color .25s var(--ease),
      opacity .45s var(--ease);
  }
  .js .tool { opacity: 0; transform: translateY(10px); }
  .js .grid.in .tool { opacity: 1; transform: none; transition-delay: calc(var(--i, 0) * 55ms); }
  @media (hover: hover) {
    .tool:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
      border-color: var(--hover-border);
    }
    .tool:hover .t-chev { color: var(--accent); transform: translateX(2px); }
  }
  .tool:active { transform: translateY(0); }
  .tool:focus-visible {
    outline: none;
    box-shadow: 0 0 0 3px var(--focus-ring), var(--shadow);
  }

  .t-icon {
    flex-shrink: 0;
    width: 38px;
    height: 38px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    background-image: linear-gradient(150deg, rgba(255, 255, 255, .28), rgba(255, 255, 255, 0) 62%);
    box-shadow: 0 2px 6px rgba(0, 0, 0, .12), inset 0 1px 0 rgba(255, 255, 255, .22);
  }
  .t-icon svg { width: 19px; height: 19px; }

  .t-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .t-name { font-size: 14px; font-weight: 600; letter-spacing: -0.1px; line-height: 1.35; }
  .t-desc {
    font-size: 12px;
    color: var(--text-2);
    line-height: 1.45;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .t-chev {
    flex-shrink: 0;
    width: 16px;
    height: 16px;
    color: var(--text-3);
    opacity: .8;
    transition: color .2s var(--ease), transform .2s var(--ease);
  }
  .t-chev svg { width: 100%; height: 100%; }

  /* ================= 空状态 ================= */
  .empty {
    padding: 48px 24px;
    text-align: center;
    border: 1px dashed var(--line);
    border-radius: var(--radius);
  }
  .empty-icon { width: 36px; height: 36px; margin: 0 auto 12px; color: var(--text-3); }
  .empty-icon svg { width: 100%; height: 100%; }
  .empty-title { font-size: 14px; font-weight: 600; color: var(--text); }
  .empty-desc { margin-top: 5px; font-size: 12.5px; color: var(--text-3); line-height: 1.6; }
  .empty-reset {
    margin-top: 16px;
    height: 30px;
    padding: 0 14px;
    border: none;
    border-radius: var(--radius-sm);
    background: var(--accent);
    color: #fff;
    font-size: 12.5px;
    font-weight: 500;
    cursor: pointer;
    transition: opacity .2s var(--ease), transform .15s var(--ease);
  }
  .empty-reset:hover { opacity: .88; }
  .empty-reset:active { transform: scale(.96); }
  .empty-reset:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--focus-ring); }

  .noscript {
    padding: 40px 24px;
    text-align: center;
    font-size: 13px;
    color: var(--text-3);
    border: 1px dashed var(--line);
    border-radius: var(--radius);
  }

  /* ================= 页脚 ================= */
  .foot { border-top: 1px solid var(--line); margin-top: clamp(32px, 5vw, 56px); }
  .foot-inner {
    max-width: 1120px;
    margin: 0 auto;
    padding: 16px max(16px, env(safe-area-inset-right)) calc(20px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    font-size: 12px;
    color: var(--text-3);
  }
  .foot-links { display: flex; align-items: center; gap: 16px; }
  .foot-links a {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    color: var(--text-2);
    text-decoration: none;
    transition: color .2s var(--ease);
  }
  .foot-links a:hover { color: var(--accent); }
  .foot-links svg { width: 13px; height: 13px; }

  /* ================= 动效减弱 ================= */
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .js .tool { opacity: 1 !important; transform: none !important; transition: none !important; }
    .tool:hover, .tool:active, .icon-btn, .t-chev, .theme-btn .i { transition: none !important; transform: none !important; }
  }
</style>
</head>
<body>
  <!-- ================= 顶栏 ================= -->
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#top">
        <span class="brand-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2.5" y="2.5" width="19" height="19" rx="5"/>
            <path d="M9 10.5L7 12.5l2 2M15 10.5l2 2-2 2"/>
          </svg>
        </span>
        <span class="brand-name">htools</span>
        <span class="brand-sep" aria-hidden="true"></span>
        <span class="brand-sub">单文件小工具合集</span>
      </a>

      <div class="topbar-search" role="search">
        <span class="s-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
        </span>
        <input id="search-input" type="text" placeholder="搜索工具…" aria-label="搜索工具" autocomplete="off" spellcheck="false">
        <span class="s-hint" id="search-hint" aria-hidden="true">/</span>
        <button class="s-clear" id="search-clear" aria-label="清除搜索">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <div class="topbar-actions">
        <a class="icon-btn" href="https://github.com/ooghoo/htools" target="_blank" rel="noopener" aria-label="GitHub 仓库">
          <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.4 7.4 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
          </svg>
        </a>
        <button class="icon-btn theme-btn" id="theme-toggle" aria-label="切换深浅色模式">
          <span class="i i-moon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 8.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </span>
          <span class="i i-sun" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
          </span>
        </button>
      </div>
    </div>
  </header>

  <!-- ================= 主区 ================= -->
  <main class="wrap" id="top">
    <div class="page-head">
      <div>
        <h1>全部工具</h1>
        <p class="page-sub">每个工具都是一个独立的单文件 HTML —— 纯前端、零依赖、离线可用，双击就能用。</p>
      </div>
      <span class="count-pill" id="count" aria-live="polite">0</span>
    </div>

    <div class="grid" id="grid">
      <noscript><p class="noscript">启用 JavaScript 后，这里会列出全部工具。</p></noscript>
    </div>

    <div class="empty" id="empty" hidden>
      <div class="empty-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/><path d="M8.5 8.5l5 5M13.5 8.5l-5 5"/></svg>
      </div>
      <p class="empty-title" id="empty-title"></p>
      <p class="empty-desc" id="empty-desc"></p>
      <button class="empty-reset" id="empty-reset" hidden>清除搜索</button>
    </div>
  </main>

  <!-- ================= 页脚 ================= -->
  <footer class="foot">
    <div class="foot-inner">
      <span>© 2026 ooghoo · 纯前端 · 零依赖 · 离线可用</span>
      <nav class="foot-links" aria-label="页脚链接">
        <a href="https://github.com/ooghoo/htools" target="_blank" rel="noopener">

<script src="tools.js"></script>
<script>
(function () {
  'use strict';

  /* ---------- 图标库（新增工具时在这里补图标） ---------- */
  var ICONS = {
    byte: '<ellipse cx="12" cy="5.5" rx="7.5" ry="3"/><path d="M4.5 5.5v6c0 1.66 3.36 3 7.5 3s7.5-1.34 7.5-3v-6"/><path d="M4.5 11.5c0 1.66 3.36 3 7.5 3s7.5-1.34 7.5-3"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    code: '<path d="M9 8l-4 4 4 4M15 8l4 4-4 4"/>',
    text: '<path d="M4 6.5V5h16v1.5M12 5v14M8.5 19h7"/>',
    time: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3.5 2"/>',
    color: '<path d="M12 3.5c4.7 0 8.5 3.4 8.5 7.6 0 2.6-2 4.4-4.4 4.4h-2.3c-1 0-1.6.7-1.6 1.6 0 .5.2.9.2 1.4 0 .9-.7 1.5-1.5 1.5-4.4 0-7.9-3.7-7.9-8.2C3 6.9 6.9 3.5 12 3.5z"/><circle cx="8" cy="9.5" r="1.3" fill="currentColor" stroke="none"/><circle cx="12" cy="7.5" r="1.3" fill="currentColor" stroke="none"/><circle cx="16" cy="9.5" r="1.3" fill="currentColor" stroke="none"/>',
    image: '<rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="M3.5 16.5l4.5-4.5 4 3.5 3.5-3 5 4.5"/>'
  };

  var grid = document.getElementById('grid');
  var countEl = document.getElementById('count');
  var emptyEl = document.getElementById('empty');
  var emptyTitle = document.getElementById('empty-title');
  var emptyDesc = document.getElementById('empty-desc');
  var emptyReset = document.getElementById('empty-reset');
  var searchInput = document.getElementById('search-input');
  var searchClear = document.getElementById('search-clear');
  var searchHint = document.getElementById('search-hint');
  var metaTheme = document.getElementById('meta-theme');
  var themeBtn = document.getElementById('theme-toggle');

  var list = (typeof TOOLS !== 'undefined' && Array.isArray(TOOLS)) ? TOOLS : [];
  var cards = [];
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function iconSvg(inner, w) {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="' + (w || 1.6) + '" stroke-linecap="round" stroke-linejoin="round">' + inner + '</svg>';
  }

  function buildCard(t, i) {
    var a = document.createElement('a');
    a.className = 'tool';
    a.href = t.file;
    a.style.setProperty('--i', i);

    var icon = document.createElement('span');
    icon.className = 't-icon';
    icon.style.backgroundColor = t.accent || '#0071e3';
    icon.setAttribute('aria-hidden', 'true');
    icon.innerHTML = iconSvg(ICONS[t.icon] || ICONS.plus);

    var body = document.createElement('span');
    body.className = 't-body';

    var name = document.createElement('span');
    name.className = 't-name';
    name.textContent = t.name;

    var desc = document.createElement('span');
    desc.className = 't-desc';
    desc.textContent = t.desc;

    body.appendChild(name);
    body.appendChild(desc);

    var chev = document.createElement('span');
    chev.className = 't-chev';
    chev.setAttribute('aria-hidden', 'true');
    chev.innerHTML = iconSvg('<path d="M9 18l6-6-6-6"/>', 2.2);

    a.appendChild(icon);
    a.appendChild(body);
    a.appendChild(chev);
    return a;
  }

  function updateCount(shown, total, filtering) {
    countEl.textContent = filtering ? (shown + ' / ' + total) : (total + ' 个工具');
  }

  function showEmpty(kind, q) {
    if (kind === 'reg') {
      emptyTitle.textContent = '还没有工具';
      emptyDesc.textContent = '在 tools.js 里注册一条，就会出现在这里。';
      emptyReset.hidden = true;
    } else {
      emptyTitle.textContent = '没有找到匹配的工具';
      emptyDesc.textContent = '没有包含「' + q + '」的工具，换个关键词试试。';
      emptyReset.hidden = false;
    }
    emptyEl.hidden = false;
  }

  function hideEmpty() { emptyEl.hidden = true; }

  function updateHint() {
    var hide = !!searchInput.value || document.activeElement === searchInput;
    searchHint.style.opacity = hide ? '0' : '';
  }

  function applyFilter() {
    var q = searchInput.value.trim().toLowerCase();
    var shown = 0;
    cards.forEach(function (c) {
      var hay = (c.data.name + ' ' + (c.data.desc || '') + ' ' + c.data.file).toLowerCase();
      var match = !q || hay.indexOf(q) !== -1;
      c.el.style.display = match ? '' : 'none';
      if (match) shown++;
    });
    updateCount(shown, list.length, !!q);
    searchClear.classList.toggle('show', !!searchInput.value);
    updateHint();
    if (list.length && shown === 0) showEmpty('search', searchInput.value.trim());
    else hideEmpty();
  }

  if (!list.length) {
    showEmpty('reg');
    updateCount(0, 0, false);
  } else {
    list.forEach(function (t, i) {
      var a = buildCard(t, i);
      grid.appendChild(a);
      cards.push({ data: t, el: a });
    });
    updateCount(list.length, list.length, false);

    /* 入场：整网格淡入，卡片错峰；结束后清掉 delay，避免拖慢悬停过渡 */
    requestAnimationFrame(function () {
      requestAnimationFrame(function () { grid.classList.add('in'); });
    });
    if (!reduceMotion) {
      cards.forEach(function (c) {
        c.el.addEventListener('transitionend', function onEnd(e) {
          if (e.propertyName === 'transform') {
            c.el.style.transitionDelay = '';
            c.el.removeEventListener('transitionend', onEnd);
          }
        });
      });
    }
  }

  /* ---------- 搜索 ---------- */
  function clearSearch() {
    searchInput.value = '';
    applyFilter();
    searchInput.focus();
  }
  searchInput.addEventListener('input', applyFilter);
  searchInput.addEventListener('focus', updateHint);
  searchInput.addEventListener('blur', updateHint);
  searchInput.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      searchInput.value = '';
      applyFilter();
      searchInput.blur();
    }
  });
  searchClear.addEventListener('click', clearSearch);
  emptyReset.addEventListener('click', clearSearch);

  /* 按 "/" 快速聚焦搜索框 */
  document.addEventListener('keydown', function (e) {
    if (e.key !== '/' || e.metaKey || e.ctrlKey || e.altKey) return;
    var ae = document.activeElement;
    if (ae === searchInput || (ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName))) return;
    e.preventDefault();
    searchInput.focus();
  });

  /* ---------- 深浅色：默认跟随系统，手动选择后记住并停止跟随 ---------- */
  var mq = window.matchMedia('(prefers-color-scheme: dark)');
  function storedTheme() {
    try { return localStorage.getItem('htools:theme'); } catch (e) { return null; }
  }
  function currentTheme() {
    return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  }
  function applyTheme(t, persist) {
    document.documentElement.setAttribute('data-theme', t);
    if (metaTheme) metaTheme.setAttribute('content', t === 'dark' ? '#000000' : '#f6f6f8');
    if (persist) {
      try { localStorage.setItem('htools:theme', t); } catch (e) {}
    }
  }
  applyTheme(currentTheme(), false);
  themeBtn.addEventListener('click', function () {
    applyTheme(currentTheme() === 'dark' ? 'light' : 'dark', true);
  });
  /* 未手动选择过时，系统深浅色变化实时跟随 */
  if (typeof mq.addEventListener === 'function') {
    mq.addEventListener('change', function (e) {
      if (!storedTheme()) applyTheme(e.matches ? 'dark' : 'light', false);
    });
  }
})();
</script>
</body>
